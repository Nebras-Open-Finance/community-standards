name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validateExpected:
    name: validateExpected
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Run tests
        env:
          # Read-only PAT for cross-repo reads against Nebras-Open-Finance/api-specs.
          # Provisioned by terraform-controller (github/actions_secrets.tf).
          GITHUB_TOKEN: ${{ secrets.SPECS_READ_TOKEN }}
        run: npm test
