openapi: 3.0.3
info:
  title: 'OFP-005 · Consent audit sub-resource (draft)'
  version: 0.1.0-draft
  description: >
    DRAFT proposal schema for **OFP-005 — Confirm data deletion when a consent is
    revoked**. This is not a published specification; it is a working draft
    attached to the proposal to make the shape concrete.


    The proposal adds an **append-only `audit` sub-resource** to each consent
    resource. A TPP `POST`s a record to report an action it has taken against the
    consent — today, that it has dealt with the data it no longer has a lawful
    basis to hold once the consent ended (whether revoked or expired), in line
    with its statutory obligations. A record's `Outcome` says whether the data has
    been `Deleted`, is `Planned` for deletion by a date, or has `NotDeleted` with a
    reason (for example, lawful retention). A TPP `GET`s the sub-resource to see
    the records it has posted.


    There is deliberately **no state model**: each `POST` creates a new, immutable
    record, and the only relationship a record has is to the consent it hangs off.
    The record's `Type` is the extension point — a future obligation to report
    something else against a consent becomes a new `Type`, not a new API.


    The same sub-resource applies to all three consent types: Bank Data Sharing,
    Bank Service Initiation, and Insurance.
  contact:
    name: UAE Open Finance
tags:
  - name: Bank Data Sharing Consent Audit
  - name: Bank Service Initiation Consent Audit
  - name: Insurance Consent Audit

paths:
  # ────────────────────────────────────────────────────────────────────────────
  # Bank Data Sharing (Account Access)
  # ────────────────────────────────────────────────────────────────────────────
  /account-access-consents/{ConsentId}/audit:
    post:
      tags:
        - Bank Data Sharing Consent Audit
      summary: Append an audit record to a Bank Data Sharing consent
      description: >
        Create a new, immutable audit record against the consent identified by
        `ConsentId`. Used by the TPP to report that it has deleted the data it
        no longer has a lawful basis to hold once the consent ended — whether
        revoked or expired.
      operationId: PostAccountAccessConsentAudit
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEConsentAuditRecordRequest'
      responses:
        '201':
          description: The audit record was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEConsentAuditRecordResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - accounts
    get:
      tags:
        - Bank Data Sharing Consent Audit
      summary: List the audit records posted against a Bank Data Sharing consent
      description: >
        Retrieve the audit records the TPP has posted against the consent
        identified by `ConsentId`, most recent first.
      operationId: GetAccountAccessConsentAudit
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: The list of audit records for the consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEConsentAuditRecordList'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - accounts

  # ────────────────────────────────────────────────────────────────────────────
  # Bank Service Initiation (Payments)
  # ────────────────────────────────────────────────────────────────────────────
  /payment-consents/{ConsentId}/audit:
    post:
      tags:
        - Bank Service Initiation Consent Audit
      summary: Append an audit record to a Bank Service Initiation consent
      description: >
        Create a new, immutable audit record against a payment consent. A payment
        consent is not empty: it carries debtor and creditor account details,
        amounts, references, and charge and exchange-rate information, plus any
        account data the TPP retrieved to set the payment up. When the consent
        ends — revoked or expired — that data falls under the same deletion
        obligation as a Data Sharing consent.
      operationId: PostPaymentConsentAudit
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEConsentAuditRecordRequest'
      responses:
        '201':
          description: The audit record was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEConsentAuditRecordResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - payments
    get:
      tags:
        - Bank Service Initiation Consent Audit
      summary: List the audit records posted against a Bank Service Initiation consent
      operationId: GetPaymentConsentAudit
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: The list of audit records for the consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEConsentAuditRecordList'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - payments

  # ────────────────────────────────────────────────────────────────────────────
  # Insurance (all insurance types)
  # ────────────────────────────────────────────────────────────────────────────
  /insurance-consents/{ConsentId}/audit:
    post:
      tags:
        - Insurance Consent Audit
      summary: Append an audit record to an Insurance consent
      description: >
        Create a new, immutable audit record against an insurance consent. Applies
        across every insurance type (for example Motor, Health, Home, Life,
        Travel), each carrying policy and claims data held under the consent.
      operationId: PostInsuranceConsentAudit
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEConsentAuditRecordRequest'
      responses:
        '201':
          description: The audit record was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEConsentAuditRecordResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - insurance
    get:
      tags:
        - Insurance Consent Audit
      summary: List the audit records posted against an Insurance consent
      operationId: GetInsuranceConsentAudit
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: The list of audit records for the consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEConsentAuditRecordList'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - insurance

components:
  # ────────────────────────────────────────────────────────────────────────────
  parameters:
    ConsentId:
      name: ConsentId
      in: path
      required: true
      description: Unique identification of the consent the audit record concerns.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Authorization:
      name: Authorization
      in: header
      required: true
      description: >
        Bearer token. Because a record may be posted after the consent has ended
        — revoked or expired, at which point the consent-bound access token is no
        longer valid — this call is authorised by a TPP client-level credential
        scoped to consent management, not the customer's access token.
      schema:
        type: string
    x-fapi-auth-date:
      name: x-fapi-auth-date
      in: header
      required: false
      schema:
        type: string
    x-fapi-customer-ip-address:
      name: x-fapi-customer-ip-address
      in: header
      required: false
      schema:
        type: string
    x-fapi-interaction-id:
      name: x-fapi-interaction-id
      in: header
      required: false
      description: An RFC4122 UID used as a correlation id.
      schema:
        type: string

  # ────────────────────────────────────────────────────────────────────────────
  securitySchemes:
    TPPOAuth2Security:
      type: oauth2
      description: TPP client credentials, scoped to consent management.
      flows:
        clientCredentials:
          tokenUrl: https://auth.openfinance.ae/token
          scopes:
            accounts: Bank Data Sharing consents
            payments: Bank Service Initiation consents
            insurance: Insurance consents

  # ────────────────────────────────────────────────────────────────────────────
  schemas:
    AEConsentAuditType:
      title: Consent audit record type
      description: >
        The kind of action being reported against the consent. This is the
        extension point for the pattern: a future obligation to report something
        else against a consent is added here as a new value, without a new API.
        `DataDeletion` is the only value defined today.
      type: string
      enum:
        - DataDeletion

    AEDataDeletionOutcome:
      title: Data deletion outcome
      description: >
        What the TPP is reporting about the data it held under the consent. This
        is data carried on the record, not a status the consent enforces — the
        record is still immutable and append-only. The outcome selects which
        additional field the record must carry (see the `oneOf` on the request).
      type: string
      enum:
        - Deleted
        - Planned
        - NotDeleted

    AEDataDeletionDeleted:
      title: Data deletion — Deleted
      description: The data held under the consent has been deleted.
      type: object
      required:
        - Type
        - Outcome
        - EventDateTime
      additionalProperties: false
      properties:
        Type:
          $ref: '#/components/schemas/AEConsentAuditType'
        Outcome:
          description: Fixed value `Deleted`.
          type: string
          enum:
            - Deleted
        EventDateTime:
          description: >
            The date and time at which the data was deleted. ISO 8601 date-time
            with a timezone, e.g. 2026-07-09T14:12:00Z.
          type: string
          format: date-time
        Description:
          description: >
            Optional free-text note from the TPP — for example, to note records
            retained under a legal obligation alongside the data that was deleted.
          type: string
          maxLength: 256

    AEDataDeletionPlanned:
      title: Data deletion — Planned
      description: >
        Deletion has not happened yet but is scheduled. Requires the date by which
        the data will have been deleted.
      type: object
      required:
        - Type
        - Outcome
        - EventDateTime
        - PlannedDeletionDateTime
      additionalProperties: false
      properties:
        Type:
          $ref: '#/components/schemas/AEConsentAuditType'
        Outcome:
          description: Fixed value `Planned`.
          type: string
          enum:
            - Planned
        EventDateTime:
          description: The date and time at which the TPP recorded this plan.
          type: string
          format: date-time
        PlannedDeletionDateTime:
          description: >
            The date and time by which the TPP will have deleted the data. A TPP
            is expected to follow up with a `Deleted` record once done.
          type: string
          format: date-time
        Description:
          description: Optional free-text note from the TPP.
          type: string
          maxLength: 256

    AEDataDeletionNotDeleted:
      title: Data deletion — NotDeleted
      description: >
        The data has not been deleted. Requires a reason — for example, that it is
        retained to meet a legal or regulatory record-keeping obligation.
      type: object
      required:
        - Type
        - Outcome
        - EventDateTime
        - Reason
      additionalProperties: false
      properties:
        Type:
          $ref: '#/components/schemas/AEConsentAuditType'
        Outcome:
          description: Fixed value `NotDeleted`.
          type: string
          enum:
            - NotDeleted
        EventDateTime:
          description: The date and time at which the TPP recorded this outcome.
          type: string
          format: date-time
        Reason:
          description: >
            Why the data has not been deleted — for example, retained under an
            anti-money-laundering record-keeping obligation.
          type: string
          minLength: 1
          maxLength: 512
        Description:
          description: Optional free-text note from the TPP.
          type: string
          maxLength: 256

    AEConsentAuditRecordRequest:
      title: Consent audit record — request
      description: >
        The record a TPP posts against a consent. The `Outcome` selects the shape:
        a `Deleted` record needs only the deletion time; a `Planned` record must
        carry `PlannedDeletionDateTime`; a `NotDeleted` record must carry `Reason`.
      type: object
      required:
        - Data
      additionalProperties: false
      properties:
        Data:
          oneOf:
            - $ref: '#/components/schemas/AEDataDeletionDeleted'
            - $ref: '#/components/schemas/AEDataDeletionPlanned'
            - $ref: '#/components/schemas/AEDataDeletionNotDeleted'
          discriminator:
            propertyName: Outcome
            mapping:
              Deleted: '#/components/schemas/AEDataDeletionDeleted'
              Planned: '#/components/schemas/AEDataDeletionPlanned'
              NotDeleted: '#/components/schemas/AEDataDeletionNotDeleted'

    AEConsentAuditRecord:
      title: Consent audit record
      description: >
        A single immutable audit record held against the consent. `Outcome`
        determines which of `PlannedDeletionDateTime` / `Reason` is present.
      type: object
      required:
        - AuditId
        - Type
        - Outcome
        - EventDateTime
        - CreationDateTime
      additionalProperties: false
      properties:
        AuditId:
          description: Unique identifier the API Hub assigns to the record.
          type: string
        Type:
          $ref: '#/components/schemas/AEConsentAuditType'
        Outcome:
          $ref: '#/components/schemas/AEDataDeletionOutcome'
        EventDateTime:
          description: >
            The date and time the reported action occurred or was recorded — for a
            `Deleted` outcome, when the data was deleted.
          type: string
          format: date-time
        PlannedDeletionDateTime:
          description: >
            Present when `Outcome` is `Planned` — the date by which the data will
            have been deleted.
          type: string
          format: date-time
        Reason:
          description: >
            Present when `Outcome` is `NotDeleted` — why the data has not been
            deleted.
          type: string
          maxLength: 512
        Description:
          description: Optional free-text note supplied by the TPP.
          type: string
          maxLength: 256
        CreationDateTime:
          description: The date and time at which the API Hub recorded the audit record.
          type: string
          format: date-time

    AEConsentAuditRecordResponse:
      title: Consent audit record — response
      description: The record created by a POST.
      type: object
      required:
        - Data
      additionalProperties: false
      properties:
        Data:
          $ref: '#/components/schemas/AEConsentAuditRecord'

    AEConsentAuditRecordList:
      title: Consent audit record list
      description: The audit records posted against a consent, most recent first.
      type: object
      required:
        - Data
      additionalProperties: false
      properties:
        Data:
          type: array
          items:
            $ref: '#/components/schemas/AEConsentAuditRecord'

    AEErrorResponse:
      title: Error response
      type: object
      required:
        - Code
        - Message
      additionalProperties: false
      properties:
        Code:
          type: string
        Id:
          type: string
        Message:
          type: string
        Errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              ErrorCode:
                type: string
              Message:
                type: string

  # ────────────────────────────────────────────────────────────────────────────
  responses:
    400Error:
      description: Bad request — the record failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    401Error:
      description: Unauthorised.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    403Error:
      description: Forbidden — the caller may not post against this consent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    404Error:
      description: The consent was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
