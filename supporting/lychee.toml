# lychee config — used by the internal link check in CI.
# See https://lychee.cli.rs/usage/config/

# PR workflow only checks internal links. External links are covered by
# the scheduled external-links workflow (if/when added), which can override
# these settings via CLI flags.

# Don't fail on external URLs in the default PR run — only validate internal paths.
exclude = [
  '^https?://',
  '^mailto:',
  '^tel:',
]

# Anchors are deliberately NOT checked — vite-ssg generates slugs at build time
# and lychee's fragment resolution doesn't always match. Fragment checking is
# opt-in in lychee (`include_fragments = "full"`), so leaving it unset is enough.
# Do not set it to `false`: since lychee 0.24 the key takes a string, not a bool.

# vite-ssg emits clean URLs by default, so internal hrefs like `/foo/bar`
# resolve to `/foo/bar.html` (or `/foo/bar/index.html`) in the built output.
# Tell lychee to try those extensions before declaring the link broken.
fallback_extensions = ['html']

# Don't fail build on cache/transient issues.
max_retries = 2
retry_wait_time = 2

# Accept common success codes.
accept = ['200', '204', '206', '301', '302', '304']

# Quiet noisy output; CI summary is enough.
no_progress = true
