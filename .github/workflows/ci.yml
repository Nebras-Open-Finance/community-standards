name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch OpenAPI specs
        env:
          # Authenticated requests to avoid GitHub API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:specs

      - name: Validate OpenAPI specs
        run: npm run validate:specs

      - name: Build docs
        run: npx vitepress build docs

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --base docs/.vitepress/dist docs/.vitepress/dist
          fail: true
