# OFP-002 — Draft INTERNATIONAL payment schema (targets standards V2.2)
#
# This is the INTERNATIONAL half of the proposed top-level split of the Bank
# Service Initiation payment schema (PAR + POST /payments). It is BANKING
# cross-border initiation — the LFI performs its own currency conversion. The
# exchange-house FX quoting flow (FX Service Initiation, /fx-quotes, FxQuoteId)
# is a SEPARATE specification and is intentionally OUT OF SCOPE here.
#
# WHAT THIS DRAFT CHANGES (cleartext request `Data` only) vs today:
#   1. Amount becomes an explicit choice between the EXTERNAL/target amount
#      (InstructedAmount) and the INTERNAL/source amount (EquivalentAmount), each
#      reusing the domestic { Amount, Currency } shape (ISO 20022 InstdAmt / EqvtAmt).
#   2. The FX fields that used to sit in `CurrencyRequest` are flattened onto Data
#      (ExchangeRateInformation, ChargeBearer, InstructionPriority,
#      DestinationCountryCode, CurrencyOfTransfer-via-amount). FxQuoteId is REMOVED.
#   3. Payment purpose splits into an EXTERNAL code (ISO 20022 ExternalPurpose1Code
#      — the domestic Aani 3-letter list no longer applies to international) and a
#      simple INTERNAL ProprietaryPurposeCode, alongside the free-text ExtendedPurpose.
#   4. EndToEndIdentification is added (ISO 20022 EndToEndId) for cross-border tracking.
#
# WHAT THIS DRAFT DOES NOT CHANGE: the encrypted PersonalIdentifiableInformation
# (`Initiation`) block — creditor, creditor account, and creditor agent — is left
# exactly as today. The cross-border creditor/agent additions (intermediary agents,
# ultimate parties, regulatory reporting, structured remittance information) are
# RECOMMENDED as the next step and tracked in the proposal asks, not modelled here.
#
# SELF-CONTAINED FOR RENDERING: the schemas the proposal changes are defined in
# full. Schemas that are UNCHANGED from the published spec are included below only
# so this document resolves and renders standalone — small leaf types carry their
# real definition; heavy composites (AERisk, AEAddress, the consent building
# blocks) are concise stubs marked "unchanged — see published spec". The published
# source of truth is api-specs: dist/standards/v2.1-errata2/uae-bank-initiation-openapi.yaml
# and uae-authorization-endpoints-openapi.yaml. This is a working draft, not a
# committed specification.

openapi: 3.0.3
info:
  title: OFP-002 — International Payment Schema (draft)
  version: 0.2.0-ofp002
  description: >-
    Draft international (banking cross-border) payment definition for the proposed
    Domestic / International split. See `AEInternationalPaymentRequest` for the
    `POST /payments` request body.

paths:
  /payments:
    post:
      summary: Create an international payment (draft)
      description: Proposed international payment-creation request for OFP-002.
      requestBody:
        required: true
        content:
          application/jwt:
            schema:
              $ref: '#/components/schemas/AEInternationalPaymentRequest'
      responses:
        '201':
          description: International payment created.

components:
  schemas:
    # ═══════════════════════════════════════════════════════════════════════
    # PROPOSED — defined in full
    # ═══════════════════════════════════════════════════════════════════════

    # ─── POST /payments request — INTERNATIONAL ─────────────────────────────────
    AEInternationalPaymentRequest:
      description: International Payment Request Schema (banking cross-border).
      type: object
      additionalProperties: false
      required:
        - Data
      properties:
        Data:
          type: object
          additionalProperties: false
          required:
            - ConsentId
            - Instruction
            - PaymentPurposeCode
            - ExtendedPurpose
            - OpenFinanceBilling
          properties:
            ConsentId:
              $ref: '#/components/schemas/AEConsentId'

            # 1 ── Amount: external (instructed) vs internal (equivalent) ─────────
            Instruction:
              $ref: '#/components/schemas/AEInternationalPaymentInstruction'

            # 2 ── Currency / FX context (flattened from the old CurrencyRequest) ─
            ExchangeRateInformation:
              allOf:
                - $ref: '#/components/schemas/AEExchangeRateInformationRequest'
              description: >-
                The exchange rate context for the conversion the LFI will perform.
                Optional on the request — the LFI may apply and return its own rate.
            ChargeBearer:
              $ref: '#/components/schemas/AEChargeBearerType1Code'
            InstructionPriority:
              type: string
              enum:
                - Normal
                - Urgent
              description: Urgency the instructing party would like applied to processing (ISO InstrPrty NORM/HIGH).
            DestinationCountryCode:
              type: string
              pattern: '[A-Z]{2,2}'
              description: Country in which the Creditor Account is domiciled (ISO 3166-1 Alpha-2).

            # 3 ── Purpose: external (coded) + internal (proprietary) + free text ─
            PaymentPurposeCode:
              $ref: '#/components/schemas/AEInternationalPaymentPurposeCode'
            ProprietaryPurposeCode:
              type: string
              minLength: 1
              maxLength: 35
              description: >-
                INTERNAL payment purpose — a bank- or corridor-specific code used
                where no external code applies (ISO 20022 Purpose/Proprietary).
            ExtendedPurpose:
              type: string
              minLength: 1
              maxLength: 140
              description: Free-text purpose of the international payment.

            # 4 ── End-to-end identification ─────────────────────────────────────
            EndToEndIdentification:
              type: string
              minLength: 1
              maxLength: 35
              description: >-
                TPP-assigned reference carried unchanged end to end across the
                payment chain (ISO 20022 EndToEndId).

            DebtorReference:
              $ref: '#/components/schemas/AEDebtorReference'
            CreditorReference:
              $ref: '#/components/schemas/AECreditorReference'

            # PII / creditor — UNCHANGED from today (see header note).
            PersonalIdentifiableInformation:
              description: >-
                International Payment PII. In transit this MUST be the encrypted
                AEJWEPaymentPII (JWE) form; the decrypted JWS has the structure of
                AEInternationalPaymentPIIProperties below. Unchanged in this draft.
              anyOf:
                - $ref: '#/components/schemas/AEInternationalPaymentPIIProperties'
                - $ref: '#/components/schemas/AEJWEPaymentPII'

            OpenFinanceBilling:
              $ref: '#/components/schemas/AEServiceInitiationOpenFinancePaymentBilling'

    # ─── Amount choice — InstructedAmount XOR EquivalentAmount ───────────────────
    AEInternationalPaymentInstruction:
      type: object
      additionalProperties: false
      description: >-
        The amount to move. Provide EITHER `InstructedAmount` — the EXTERNAL / target
        amount the creditor receives, expressed in the currency of transfer (ISO 20022
        InstdAmt) — OR `EquivalentAmount` — the INTERNAL / source amount debited in the
        debtor account currency, plus the currency it is converted into (ISO 20022
        EqvtAmt). Exactly one MUST be present.
      oneOf:
        - required: [InstructedAmount]
        - required: [EquivalentAmount]
      properties:
        InstructedAmount:
          allOf:
            - $ref: '#/components/schemas/AEActiveCurrencyAmount'
          description: External / target amount — the creditor receives this in the currency of transfer.
        EquivalentAmount:
          type: object
          additionalProperties: false
          required:
            - Amount
            - CurrencyOfTransfer
          description: Internal / source amount — debited in the debtor account currency and converted into CurrencyOfTransfer.
          properties:
            Amount:
              $ref: '#/components/schemas/AEActiveCurrencyAmount'
            CurrencyOfTransfer:
              type: string
              pattern: ^[A-Z]{3,3}$
              description: Currency the equivalent amount is converted into (the creditor side).

    # ─── External payment purpose — ISO 20022 ExternalPurpose1Code ───────────────
    AEInternationalPaymentPurposeCode:
      type: string
      minLength: 1
      maxLength: 4
      pattern: ^[A-Z]{1,4}$
      description: >-
        EXTERNAL payment purpose code, aligned to the ISO 20022 ExternalPurpose1Code
        list (e.g. SALA, GDDS, CASH). The domestic Aani 3-letter purpose code does NOT
        apply to international payments.

    # ─── Exchange rate (request form) ────────────────────────────────────────────
    AEExchangeRateInformationRequest:
      type: object
      additionalProperties: false
      required:
        - UnitCurrency
        - RateType
      description: Details on the currency exchange rate and contract for the conversion.
      properties:
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: Currency in which the rate of exchange is expressed.
        ExchangeRate:
          type: number
          description: Factor used to convert an amount from one currency to another.
        RateType:
          type: string
          enum:
            - Actual
            - Agreed
            - Indicative
        ContractIdentification:
          type: string
          minLength: 1
          maxLength: 256
          description: Reference to the FX contract agreed between the parties.

    # ─── PAR consent — INTERNATIONAL payment types (RESTRICTED) ──────────────────
    # Only a single immediate payment, or a fixed-amount periodic schedule.
    AEInternationalConsentSchedule:
      type: object
      additionalProperties: false
      description: >-
        The payment types an INTERNATIONAL consent may request. Restricted to the
        two cross-border use cases that are realistically supported today.
      properties:
        SinglePayment:
          $ref: '#/components/schemas/AESingleInstantPayment'
        MultiPayment:
          # Restricted to FixedPeriodicSchedule only (NOT the full long-lived set).
          $ref: '#/components/schemas/AEInternationalLongLivedPaymentConsent'

    AEInternationalLongLivedPaymentConsent:
      type: object
      additionalProperties: false
      required:
        - PeriodicSchedule
      description: International multi-payment consent, restricted to a fixed periodic schedule.
      properties:
        MaximumCumulativeValueOfPayments:
          $ref: '#/components/schemas/AEPeriodTypeMaximumCumulativeValueOfPayments'
        MaximumCumulativeNumberOfPayments:
          type: integer
        PeriodicSchedule:
          # Single allowed type rather than the domestic oneOf over six types.
          $ref: '#/components/schemas/AEBankServiceInitiationFixedPeriodicSchedule'

    # ─── International PII / creditor — UNCHANGED from today ─────────────────────
    # Left exactly as the current spec. The cross-border additions (intermediary
    # agents, ultimate parties, regulatory reporting, structured remittance) are
    # RECOMMENDED next-step work and tracked in the proposal asks — not modelled here.
    AEInternationalPaymentPIIProperties:
      title: International Payment PII Schema Object
      type: object
      additionalProperties: false
      description: Elements of Personal Identifiable Information data for an international payment.
      properties:
        Initiation:
          $ref: '#/components/schemas/AEInternationalCreditor'
        Risk:
          $ref: '#/components/schemas/AERisk'

    AEInternationalCreditor:
      type: object
      additionalProperties: false
      required:
        - CreditorAccount
      description: >-
        Identification elements for a Creditor for an international payment instruction.
        Confirmation of Payee is NOT expected for international payments.
      properties:
        CreditorAgent:
          $ref: '#/components/schemas/AECreditorAgent'
        Creditor:
          $ref: '#/components/schemas/AECreditor'
        CreditorAccount:
          $ref: '#/components/schemas/AEInternationalCreditorAccount'

    AEInternationalCreditorAccount:
      type: object
      additionalProperties: false
      required:
        - SchemeName
        - Identification
        - Name
      description: Unambiguous identification of the international creditor account.
      properties:
        SchemeName:
          type: string
          enum:
            - IBAN
            - AccountNumber
          description: >-
            For international payments the TPP may use `IBAN`, but MUST use
            `AccountNumber` where a local scheme identifies the Creditor Account.
        Identification:
          $ref: '#/components/schemas/AEIdentification'
        Name:
          $ref: '#/components/schemas/AEName'
        TradingName:
          $ref: '#/components/schemas/AETradingName'
        Type:
          $ref: '#/components/schemas/AECreditorAccountTypeCodes'

    # ═══════════════════════════════════════════════════════════════════════
    # UNCHANGED shared schemas — included only so this draft renders standalone.
    # Source of truth: the published bank-initiation / authorization-endpoints specs.
    # ═══════════════════════════════════════════════════════════════════════

    AEConsentId:
      type: string
      minLength: 1
      maxLength: 128
      description: Unique identification assigned by the TPP to identify the consent resource.
    AEActiveCurrencyAmount:
      type: object
      required: [Amount, Currency]
      description: The Currency and Amount relating to the Payment.
      properties:
        Amount:
          $ref: '#/components/schemas/AEActiveOrHistoricAmount'
        Currency:
          $ref: '#/components/schemas/AEActiveOrHistoricCurrencyCode'
    AEActiveOrHistoricAmount:
      type: string
      pattern: ^\d{1,16}\.\d{2}$
      example: '100.00'
    AEActiveOrHistoricCurrencyCode:
      type: string
      pattern: ^[A-Z]{3,3}$
      example: AED
    AEChargeBearerType1Code:
      type: string
      enum: [BorneByCreditor, BorneByDebtor, Shared]
      description: Which party bears the charges associated with processing the payment.
    AEDebtorReference:
      type: string
      minLength: 1
      maxLength: 35
      description: A note for the reference of a given User in relation to a payment instruction.
    AECreditorReference:
      type: string
      minLength: 1
      maxLength: 35
      description: A note that supports reconciliation of a payment instruction for the Creditor.
    AEJWEPaymentPII:
      type: string
      description: JWE (encrypting a JWS) carrying the decrypted PII structure. Unchanged — see published spec.
      example: eyJhbGciOiJSU0EtT0FFUCIsImVuYyI6IkEyNTZHQ00ifQ....
    AEServiceInitiationOpenFinancePaymentBilling:
      type: object
      additionalProperties: false
      required: [Type]
      description: Billing parameters specified by the TPP for a payment initiation.
      properties:
        Type:
          type: string
          enum: [Collection, LargeValueCollection, PushP2P, PullP2P, Me2Me]
        MerchantId:
          type: string
          minLength: 8
          maxLength: 20
    AEIdentification:
      type: string
      minLength: 1
      description: Identification for the account assigned by the LFI based on the Account Scheme Name.
    AEName:
      type: object
      additionalProperties: false
      description: The Account Holder Name(s).
      properties:
        en: { type: string, maxLength: 70, description: English value }
        ar: { type: string, maxLength: 70, description: Arabic value }
    AETradingName:
      type: object
      additionalProperties: false
      description: The Trading Brand Name (if applicable) for the Creditor.
      properties:
        en: { type: string, maxLength: 70, description: English value }
        ar: { type: string, maxLength: 70, description: Arabic value }
    AECreditorAccountTypeCodes:
      type: string
      enum: [Individual, Merchant, Business, Charity, GovernmentBody, Other]
      description: The Creditor (Payee) Type.
    AECreditorAgent:
      type: object
      additionalProperties: false
      required: [SchemeName, Identification]
      description: The Financial Institution that holds the Creditor Account.
      properties:
        SchemeName:
          type: string
          enum: [BICFI, Other]
          description: 'BICFI: the BIC/SWIFT code. Other: a non-SWIFT / local scheme identifier.'
        Identification:
          type: string
          description: BIC/SWIFT code or target payment scheme identifier.
        Name:
          type: string
          minLength: 1
          maxLength: 140
        PostalAddress:
          $ref: '#/components/schemas/AEAddress'
    AECreditor:
      type: object
      additionalProperties: false
      description: Party to which an amount of money is due.
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 140
        PostalAddress:
          $ref: '#/components/schemas/AEAddress'
    AEAddress:
      type: array
      minItems: 1
      description: One or more ISO 20022 PostalAddress27 addresses. Unchanged — see published spec.
      items:
        type: object
        description: ISO 20022 PostalAddress27 (AddressType, AddressLine, structured fields, Country). Unchanged — see published spec.
    AERisk:
      type: object
      description: Risk / fraud-scoring details sent by the TPP (DebtorIndicators, TransactionIndicators, CreditorIndicators, DestinationDeliveryAddress). Unchanged — see published spec.
    AESingleInstantPayment:
      type: object
      additionalProperties: false
      description: A single immediate payment. Unchanged — see published spec.
      properties:
        Type:
          type: string
          enum: [SingleInstantPayment]
        Amount:
          type: object
          description: Amount and currency for the single payment. Unchanged — see published spec.
    AEBankServiceInitiationFixedPeriodicSchedule:
      type: object
      additionalProperties: false
      description: A fixed-amount payment recurring on a period schedule. Unchanged — see published spec.
      properties:
        Type:
          type: string
          enum: [FixedPeriodicSchedule]
        PeriodType:
          type: string
          enum: [Day, Week, Month, Year]
        PeriodStartDate:
          type: string
          format: date
        Amount:
          type: object
          description: Amount and currency for each scheduled payment. Unchanged — see published spec.
    AEPeriodTypeMaximumCumulativeValueOfPayments:
      type: object
      additionalProperties: false
      description: The maximum cumulative payment value per period. Unchanged — see published spec.
      properties:
        Amount: { type: string }
        Currency: { type: string }
