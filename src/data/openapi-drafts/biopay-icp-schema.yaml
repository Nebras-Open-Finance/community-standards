# BioPay — DRAFT OpenAPI document for the third-party-facing surface.
#
# Every operation here is consumed by the Biometric Payment Initiation Provider
# (BPIP) — the merchant's acquirer — against the API Hub, with two exceptions:
#   - the payment status event, which the Hub POSTs to an endpoint the BPIP
#     implements, and
#   - PATCH /biometrics-payment-log/{id}, which the LFI calls on the Hub.
# Direction is stated in each operation description.
#
# Identity resolution is NOT modelled here. The BPIP resolves the customer
# directly with ICP through the ICP SDK, outside the API Hub, and receives the
# uaeKycId, the customer's default LFI and an ICP authorisation: a JWS signed by
# ICP and bound to this transaction. The ICP authorisation is presented once, on
# POST /instrument-lookup. In exchange, the API Hub returns a payment token: a
# short-lived, single-use JWS signed by the API Hub that embeds the ICP
# authorisation and states whether this is an account or a card payment. The
# payment token — not the ICP authorisation — is what the BPIP presents to make
# the payment: on POST /biometric-payments for an account, or to the card scheme
# (e.g. Jaywan) for a card. See AEIcpAuthorisation and AEPaymentToken.
#
# PATCH /biometrics-payment-log/{id} is modelled because it is how the payment
# status the BPIP polls and is notified of comes to exist. It is served at the
# Consent Manager host, not at the rs1.* host the rest of this document uses.
#
# Nothing in this document is published. Field names, enum values, endpoint
# paths and status vocabulary are all proposals for review. The status values
# and reject-reason namespaces are those of Open Finance domestic payments
# (see /tech/lfi-api-hub/v2.1/banking/service-initiation/domestic-payments/
# overview/payment-status) so BioPay does not invent a second vocabulary.
#
# The payment status event follows the published webhook template: the same
# signed envelope, the same Data/Meta split under the message claim, the same
# Resource.Created/Updated/Deleted event types, delivered as application/jwe.
#
# The request operations use unsigned JSON with a detached x-jws-signature
# header; whether they should move to a signed-body pattern is an open item.

openapi: 3.0.3

info:
  title: BioPay — Biometric Payments (draft)
  version: 0.1.0-draft
  description: >-
    Draft third-party-facing API for BioPay: a payment journey in which a
    customer is identified biometrically by ICP, and a Biometric Payment
    Initiation Provider (BPIP) — the merchant's acquirer — looks up the
    customer's payment instrument and initiates the payment through the API
    Hub under a `client_credentials` grant. No biometric, template or match
    score crosses into Open Finance. What crosses is a `uaeKycId` and ICP's
    signed authorisation that it identified the person for this transaction,
    which the API Hub exchanges for a single-use payment token.

servers:
  - url: https://rs1.[LFICODE].apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Production
  - url: https://rs1.[LFICODE].preprod.apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Pre-production
  - url: https://rs1.altareq1.sandbox.apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Sandbox

tags:
  - name: Instrument lookup
    description: >-
      Asking the LFI which payment instrument a registered customer pays
      with, before the BPIP chooses a rail. Called on every payment.
  - name: Payment
    description: Initiating an account-to-account biometric payment and tracking its status.
  - name: Payment status event
    description: >-
      Notifying the BPIP of a change in a payment's status. Delivered by the
      API Hub to an endpoint the BPIP implements.
  - name: Payment log
    description: >-
      Reporting the outcome of a biometric payment. Called by the LFI, not by
      the BPIP.

paths:
  # ═════════════════════════════════════════════════════════════════════════
  # PAYMENT
  # ═════════════════════════════════════════════════════════════════════════
  /biometric-payments:
    post:
      tags: [Payment]
      operationId: createBiometricPayment
      summary: Initiate a biometric payment
      description: >-
        **BPIP → API Hub → LFI.** Initiates an account-to-account payment over
        AANI against a registered customer, after `POST /instrument-lookup` has
        returned `PaymentInstrument: AANI`. AANI is the only rail this
        operation accepts. `Data.DebtorAccount` carries the customer's IBAN
        exactly as the lookup returned it; the LFI MUST reject the payment if
        it is not the account registered for BioPay against the `uaeKycId`.
        There is no consent resource and no access-token subject: the
        customer's standing authority was established at registration, and
        their authority for **this** payment is the payment token the lookup
        returned, carried in `Data.PaymentToken`.


        The API Hub verifies the payment token: its own signature; that it has
        not expired; that `PaymentType` is `Account`; that `cnf.x5t#S256`
        matches the BPIP's mTLS client certificate and `azp` the calling BPIP;
        that `sub`, `DebtorAccount` and `InstructedAmount` equal those in the
        request; and that its `jti` has not been used. It then derives
        `BiometricAssurance` from the ICP authorisation embedded in the token,
        validates the request against its schema, and proxies to the LFI's
        Ozone Connect. The LFI relies on the Hub's verification and does not
        verify the token itself.


        The Hub marks the payment token's `jti` used when the LFI creates the
        payment; if the LFI returns an error, no payment exists and the token
        remains usable until it expires. A retry with the same
        `x-idempotency-key` and identical body may present the same token; any
        other reuse is rejected.


        Account state is checked before the payment is created, and a blocked
        or closed account is returned as a `403`. The LFI's fraud, sanctions
        and AML screening and its balance check run after creation; their
        outcome is a `Rejected` status with a `StatusReason`, delivered by the
        payment status event and on the GET operations.


        Card payments do not use this operation. For a card, the BPIP submits
        the authorisation to the card scheme with the card credential and the
        payment token the lookup returned.


        The response is always `201` with `Status: Pending`. Execution on the
        rail is asynchronous; the LFI patches status to the Hub, which serves
        the updated resource on the GET operations and, where the request
        carried an active `Data.Subscription.Webhook`, sends a payment status
        event to its `Url`.
      parameters:
        - $ref: '#/components/parameters/XIdempotencyKey'
        - $ref: '#/components/parameters/XJwsSignature'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricPaymentRequest'
      responses:
        '201':
          description: >-
            Payment accepted for execution. A replay of the same
            `x-idempotency-key` with an identical body returns the original
            resource and this same `201`, not a duplicate payment.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEBiometricPaymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/BiometricPaymentForbidden' }
        '409':
          description: >-
            The `x-idempotency-key` has already been used with a different
            request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    get:
      tags: [Payment]
      operationId: getBiometricPaymentByIdempotencyKey
      summary: Retrieve a payment by idempotency key
      description: >-
        **BPIP → API Hub.** Retrieves a payment by the `IdempotencyKey` the
        BPIP supplied when creating it. This is the recovery path for a lost
        `201`: when the BPIP does not know whether a payment was created, it
        queries by the key it generated rather than initiating again.


        Returns the single matching payment. When no payment exists for the key,
        the response is `200` with an empty `Data` array — the BPIP can then
        safely retry the original request, provided its ICP authorisation has
        not expired.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyQuery'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      responses:
        '200':
          description: Zero or one matching payment.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEBiometricPaymentQueryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /biometric-payments/{PaymentId}:
    get:
      tags: [Payment]
      operationId: getBiometricPayment
      summary: Retrieve a payment by PaymentId
      description: >-
        **BPIP → API Hub.** Returns the current state of a payment. The API Hub
        serves the status it holds, last set by the LFI. Polling this operation
        is the pull alternative to the payment status event; a BPIP MAY use
        either or both.
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      responses:
        '200':
          description: The payment resource.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEBiometricPaymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No payment exists with this `PaymentId` for this BPIP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ══════════════════════════════════════════════════════════════════════════
  # INSTRUMENT LOOKUP
  # ══════════════════════════════════════════════════════════════════════════
  /instrument-lookup:
    post:
      tags: [Instrument lookup]
      operationId: postInstrumentLookup
      summary: Look up a customer's payment instrument
      description: >-
        **BPIP → API Hub → LFI.** Called on every payment. After resolving the
        customer with ICP, the BPIP asks the LFI which payment instrument it
        holds for the `uaeKycId`, and receives in the same response what it
        needs for that rail: for an account, the IBAN, which it sends back on
        `POST /biometric-payments`; for a card, a one-time card scheme
        token and cryptogram, which it submits to the card scheme (e.g. Jaywan)
        as acquirer. A card payment does not return to the API Hub after the
        lookup.


        Every successful lookup also returns a **payment token**
        (`Data.PaymentToken`), minted by the API Hub once the LFI has answered.
        It embeds the ICP authorisation and states the `PaymentType`
        (`Account` or `Card`), the `PaymentInstrument`, the amount, the
        merchant and, for an account, the IBAN. The payment token replaces the
        ICP authorisation at the point of payment: the BPIP presents it once,
        on `POST /biometric-payments` for an account or to the card scheme for
        a card. See `AEPaymentToken`.


        The request carries the ICP authorisation in `Data.IcpAuthorisation`.
        Before proxying, the API Hub MUST verify it: the signature against
        ICP's published keys; that it has not expired; that `cnf.x5t#S256`
        matches the BPIP's mTLS client certificate; that `azp` matches the
        calling BPIP; that `sub` equals `Data.uaeKycId`; that `txn` equals
        the hash of `Data.InstructedAmount` and `Data.CardAcceptor`; and that
        its `jti` has not been used before. The Hub then marks the ICP
        authorisation used: it can be exchanged for one payment token only.


        The API Hub proxies the request, with the ICP authorisation, to the
        Ozone Connect endpoint of the default LFI ICP returned. The LFI SHOULD
        verify the ICP authorisation itself, as it carries the debit risk. The
        LFI answers from its own registration store of `uaeKycId` → payment
        instrument.


        For a card, the LFI generates the credential for the amount and card
        acceptor in the request, binding the cryptogram to the ICP `jti`. It
        signs the credential as a JWS and encrypts that JWS as a JWE to the
        BPIP's public encryption key from the Directory, so the API Hub
        proxies it without reading it. The card scheme verifies the payment
        token when the BPIP submits the authorisation; the LFI, as issuer,
        validates the cryptogram when the authorisation reaches it. The
        response never carries a card number (PAN).


        A `POST` rather than a `GET`, so that the `uaeKycId` travels in the
        body and stays out of access and proxy logs. The lookup creates no
        resource.


        For an account, the instrument can change between the lookup and the
        payment, so the subsequent payment request can still fail on a
        mismatch.
      parameters:
        - $ref: '#/components/parameters/XJwsSignature'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEInstrumentLookupRequest'
      responses:
        '200':
          description: The payment instrument the LFI holds for the customer.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEInstrumentLookupResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/IcpAuthorisationRejected' }
        '404':
          description: >-
            The LFI holds no live BioPay registration for this `uaeKycId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENT STATUS EVENT — API Hub → BPIP
  # ══════════════════════════════════════════════════════════════════════════
  /biometric-payment-status-events:
    post:
      tags: [Payment status event]
      operationId: postBiometricPaymentStatusEvent
      summary: Payment status event notification
      description: >-
        **API Hub → BPIP.** Delivered to the `Data.Subscription.Webhook.Url`
        the BPIP gave on `POST /biometric-payments`, each time the LFI patches
        the status of that payment, provided `IsActive` was `true`. The path
        shown is illustrative — the real target is that URL.


        Structured as an Open Finance webhook. The envelope, the `message`
        claim and the `Data` / `Meta` split are those of the published payment
        status event; `Data` is the payment resource as it stands after the
        change, in the same shape `GET /biometric-payments/{PaymentId}`
        returns. `Meta` carries `PaymentId` in the position `ConsentId` holds in
        the published event, because a biometric payment has no consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricPaymentStatusEventSigned'
          application/jwe:
            schema:
              type: string
        description: >-
          As with every other Open Finance webhook, the `application/json`
          Content Type is provided so the BPIP can understand the payload it
          must parse; it does not reflect the wire format. The event is
          delivered as a serialised, signed and encrypted JWT with the Content
          Type `application/jwe`, signed by the API Hub and encrypted to the
          BPIP's encryption certificate registered in the Directory.
      responses:
        '202':
          description: >-
            Accepted. The BPIP MUST acknowledge on receipt, with an empty
            body, and process asynchronously. The Hub retries on any non-2xx.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENT LOG — LFI → API Hub
  # ══════════════════════════════════════════════════════════════════════════
  # Served at the Consent Manager host (cm.{lfiCode}), not the rs1.* host the
  # operations above use. Modelled on the published Consent Manager operation
  # PATCH /payment-log/{id}, which is how an LFI reports the outcome of every
  # other Open Finance payment.
  /biometrics-payment-log/{id}:
    patch:
      tags: [Payment log]
      operationId: patchBiometricPaymentLog
      summary: Report the outcome of a biometric payment
      description: >-
        **LFI → API Hub.** Sets the status the API Hub holds for a biometric
        payment once the LFI knows how the rail responded. The Hub is the
        source of truth for payment state, and this is the only way that state
        changes after creation: nothing the BPIP calls can move a payment
        out of `Pending`.


        Every biometric payment is created `Pending` and the LFI MUST patch it
        to a terminal status. One patch is the normal case — straight to
        `AcceptedWithoutPosting` or `Rejected`. An LFI MAY patch
        `AcceptedSettlementCompleted` first, and MAY patch
        more than once where the rail reports progress in stages, but MUST NOT
        patch a payment that has already reached a terminal status.


        The patch is what produces everything the BPIP sees afterwards:
        the Hub records the new status, delivers the payment status event to
        the BPIP's webhook URL for the payment, and serves the updated
        resource on `GET /biometric-payments/{PaymentId}` and
        `GET /biometric-payments`. An LFI that executes the payment but never
        patches leaves the BPIP polling a payment that stays `Pending`
        forever.


        Modelled on the published Consent Manager operation
        `PATCH /payment-log/{id}`, and served at the same Consent Manager host,
        so an LFI already integrated with Open Finance is patching biometric
        payments the same way and from the same place as every other payment.


        Open items: the published operation names its fields in the dotted,
        lower-camel form `paymentResponse.status`, whereas this draft uses the
        flat PascalCase names the rest of the BioPay document uses — which
        convention wins is for review. And whether BioPay should reuse
        `PATCH /payment-log/{id}` outright rather than introduce a second
        payment log is open; it is modelled separately here because a biometric
        payment has no consent, and the published payment log is keyed to one.
      parameters:
        - $ref: '#/components/parameters/PaymentIdLogPath'
        - $ref: '#/components/parameters/XFapiInteractionId'
      requestBody:
        required: true
        description: >-
          The fields to set. Flat rather than `Data`-wrapped, following the
          published Consent Manager patch operations rather than the
          BPIP-facing convention used elsewhere in this document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricPaymentLogPatch'
      responses:
        '204':
          description: >-
            The status was recorded. No body. Delivery of the payment status
            event to the BPIP happens asynchronously and its outcome does
            not affect this response — a `204` means the Hub holds the new
            status, not that the BPIP has received it.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            The authenticated LFI does not hold the payment identified by
            `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '404':
          description: No payment exists with this `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '409':
          description: >-
            The payment has already reached a terminal status, and the
            requested transition is not permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  # ── Parameters ───────────────────────────────────────────────────────────
  parameters:
    IdempotencyKeyQuery:
      name: IdempotencyKey
      in: query
      required: true
      description: >-
        The value the BPIP sent in `x-idempotency-key` when creating the
        payment.
      schema:
        type: string
        maxLength: 40
    PaymentIdPath:
      name: PaymentId
      in: path
      required: true
      description: The API Hub's identifier for the payment.
      schema:
        type: string
        maxLength: 40
    PaymentIdLogPath:
      name: id
      in: path
      required: true
      description: >-
        The API Hub's identifier for the payment — the `PaymentId` the
        BPIP was returned on creation. Named `id` rather than `PaymentId`
        to match the published Consent Manager operation
        `PATCH /payment-log/{id}`, which this one sits alongside.
      schema:
        type: string
        maxLength: 40
    XIdempotencyKey:
      name: x-idempotency-key
      in: header
      required: true
      description: >-
        BPIP-generated key that makes payment creation safely retryable.
        MUST be unique per payment and retained by the BPIP long enough to
        support recovery via `GET /biometric-payments`.
      schema:
        type: string
        maxLength: 40
    XJwsSignature:
      name: x-jws-signature
      in: header
      required: true
      description: Detached JWS signature over the request body.
      schema:
        type: string
    XFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      required: false
      description: Correlation identifier, echoed on the response.
      schema:
        type: string
        format: uuid
    XFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      required: false
      description: >-
        The time of the biometric identification at ICP, in HTTP-date format.
      schema:
        type: string

  headers:
    XFapiInteractionId:
      description: Correlation identifier echoed from the request, or generated by the Hub.
      schema:
        type: string
        format: uuid

  # ── Responses ────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: The request was malformed or failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    Unauthorized:
      description: The access token is missing, expired or invalid.
    Forbidden:
      description: >-
        The client is authenticated but not entitled — typically a client whose
        application does not carry the BPIP role, or a token without the
        `biometric-payments` scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
    IcpAuthorisationRejected:
      description: >-
        The client is not entitled, or the ICP authorisation was rejected.
        Entitlement failures are those of every BioPay operation — a client
        whose application does not carry the BPIP role, or a token without the
        `biometric-payments` scope. ICP authorisation failures are reported
        with one of the following `ErrorCode` values (proposed):
        `IcpAuthorisation.InvalidSignature`, `IcpAuthorisation.Expired`,
        `IcpAuthorisation.BindingMismatch` (`cnf`, `azp`, `sub` or `txn` does
        not match the request), `IcpAuthorisation.AlreadyUsed` (already
        exchanged for a payment token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    BiometricPaymentForbidden:
      description: >-
        The client is not entitled, the payment token was rejected, or the LFI
        cannot debit the customer's account. No payment is created. Payment
        token failures use one of the following `ErrorCode` values (proposed):
        `PaymentToken.InvalidSignature`, `PaymentToken.Expired`,
        `PaymentToken.WrongPaymentType` (a `Card` token was presented),
        `PaymentToken.BindingMismatch` (`cnf`, `azp`, `sub`, `DebtorAccount`
        or `InstructedAmount` does not match the request),
        `PaymentToken.AlreadyUsed`. Account failures use one of the following
        `ErrorCode` values (proposed; the BioPay counterparts of the Open
        Finance `Consent.*` account codes, renamed because BioPay has no
        consent): `Account.TemporarilyBlocked` (the account is Inactive,
        Dormant or Suspended), `Account.PermanentAccessFailure` (Closed,
        Deceased or Unclaimed), `Account.TransientAccessFailure` (temporarily
        inaccessible), `Account.DebtorAccountMismatch` (`DebtorAccount` is not
        the account registered for BioPay against the `uaeKycId` — for
        example, the customer changed it after the lookup).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    InternalServerError:
      description: >-
        An unexpected error occurred at the API Hub or the LFI. `ErrorCode` is
        `GenericRecoverableError` where a retry may succeed, otherwise
        `GenericError`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'

  # ── Schemas ──────────────────────────────────────────────────────────────
  schemas:
    AEUaeKycId:
      type: string
      description: >-
        The identifier ICP issues for a verified identity, and the only
        identity-bearing value that crosses into Open Finance in this journey.
        Format to be confirmed.
      maxLength: 70
      example: ICP-7c9e1f4a-2b60-4d3e-9a15-0f8c2d1b7e43

    AEPaymentInstrument:
      type: string
      description: >-
        The payment vehicle the customer selected at registration. Determines
        which creditor schema the payment request MUST use. A card scheme is
        named directly: `JAYWAN` is the domestic card scheme (referred to as J1
        elsewhere), and `VISA` and `MASTERCARD` cover the international
        schemes, including co-badged cards. The final codes are an open item.
      enum: [AANI, CBDC, JAYWAN, VISA, MASTERCARD]

    AEPaymentStatus:
      type: string
      description: >-
        A subset of the Open Finance payment status values, mapped as for
        Open Finance domestic payments. `Pending` (PDNG) on creation.
        `AcceptedSettlementCompleted` (ACSC) is a temporary,
        payment-processing state: the debtor account has been settled.
        Terminal statuses: `AcceptedWithoutPosting` (ACWP) — the receiving
        bank has accepted the payment but the LFI cannot confirm the creditor
        account has been credited; and `Rejected` (RJCT) — rejected pre-rail
        by the LFI or post-rail by AANI / UAEFTS.
      enum:
        - Pending
        - AcceptedSettlementCompleted
        - AcceptedWithoutPosting
        - Rejected

    AEBiometricAssurance:
      type: object
      description: >-
        ICP's assertion about the identification it performed, as recorded on
        the payment resource. Derived by the API Hub from the ICP
        authorisation embedded in the payment token — not supplied by the
        BPIP — so that it is evidence ICP produced. This is the evidence set for non-repudiation and dispute
        handling. It carries no biometric data, no template and no match
        score.
      additionalProperties: false
      required: [MatchMethod, MatchDateTime, IcpTransactionId]
      properties:
        MatchMethod:
          type: string
          enum: [Fingerprint, FacialImage, Palm]
        MatchDateTime:
          type: string
          format: date-time
        IcpTransactionId:
          type: string
          description: >-
            ICP's own reference for the identification event — the `jti` of the
            ICP authorisation.
          maxLength: 40
        AssuranceLevel:
          type: string
          description: Identity assurance level asserted by ICP. Vocabulary to be confirmed.

    AEIcpAuthorisation:
      type: string
      description: >-
        A compact JWS signed by ICP, returned to the BPIP through the ICP SDK
        when ICP identifies the customer. Its claims are `AEIcpAuthorisationClaims`.
        It binds one biometric identification to one transaction. It is
        presented once, on `POST /instrument-lookup`, where the API Hub and the
        LFI verify it and the Hub exchanges it for a payment token
        (`AEPaymentToken`) that embeds it. It is not presented again: the
        payment token replaces it at the point of payment.


        Open items: how ICP's signing keys are distributed to the API Hub and
        LFIs (ICP is not a Directory participant), and the ICP SDK changes
        needed for ICP to accept the transaction hash and certificate
        thumbprint and to return this JWS.
      example: eyJhbGciOiJQUzI1NiIsImtpZCI6ImljcC1zaWduLTEifQ.eyJpc3MiOiJodHRwczovL2ljcC5nb3YuYWUiLCJzdWIiOiJJQ1AtN2M5ZTFmNGEuLi4ifQ.c2lnbmF0dXJl

    AEIcpAuthorisationClaims:
      type: object
      description: >-
        The claims of `AEIcpAuthorisation`, for reference. Signed with `PS256`.
        The BPIP does not build these: it supplies the transaction hash and
        its transport certificate thumbprint to ICP, and ICP signs.
      required: [iss, sub, azp, aud, txn, cnf, amr, jti, iat, exp]
      properties:
        iss:
          type: string
          description: ICP's issuer identifier.
        sub:
          $ref: '#/components/schemas/AEUaeKycId'
        azp:
          type: string
          description: >-
            The BPIP the authorisation was issued to — its Directory
            organisation identifier. MUST match the BPIP calling the API Hub.
        aud:
          type: string
          description: The customer's default LFI, as ICP returned it.
        txn:
          type: string
          description: >-
            Base64url SHA-256 of the canonical JSON of the transaction: the
            `InstructedAmount` and `CardAcceptor` the BPIP then sends on
            `POST /instrument-lookup`. Any change to amount or merchant after
            the biometric gesture breaks the binding and needs a new gesture.
        cnf:
          type: object
          description: >-
            Binds the authorisation to the BPIP's transport certificate, so
            that it cannot be presented by anyone without the BPIP's mTLS
            private key.
          required: ['x5t#S256']
          properties:
            x5t#S256:
              type: string
              description: Base64url SHA-256 thumbprint of the BPIP's transport certificate.
        amr:
          type: array
          items:
            type: string
            enum: [Fingerprint, FacialImage, Palm]
        acr:
          type: string
          description: Identity assurance level asserted by ICP. Vocabulary to be confirmed.
        jti:
          type: string
          maxLength: 40
          description: >-
            ICP's identifier for the identification event (`IcpTransactionId`).
            Single-use: exchanged for one payment token, on one lookup.
        iat:
          type: number
        exp:
          type: number
          description: Short-lived — proposed 120 seconds after `iat`.

    AEPaymentToken:
      type: string
      description: >-
        A compact JWS signed by the API Hub (`PS256`), returned in
        `Data.PaymentToken` by `POST /instrument-lookup`. Its claims are
        `AEPaymentTokenClaims`. It embeds the ICP authorisation and replaces it
        at the point of payment. Short-lived and single-use: presented once,
        either on `POST /biometric-payments` (`PaymentType: Account`), where
        the API Hub verifies it, or to the card scheme in the card
        authorisation (`PaymentType: Card`), where the card scheme verifies it
        against the API Hub's published signing keys.


        Open items: how the card scheme carries the token in its
        authorisation message, and the card scheme's access to the API Hub's
        signing keys.
      example: eyJhbGciOiJQUzI1NiIsImtpZCI6Imh1Yi1zaWduLTEifQ.eyJpc3MiOiJodHRwczovL2F1dGgxLmFsdGFyZXExLmFwaWh1Yi5vcGVuZmluYW5jZS5hZSJ9.c2lnbmF0dXJl

    AEPaymentTokenClaims:
      type: object
      description: >-
        The claims of `AEPaymentToken`, for reference. The BPIP does not build
        these; the API Hub signs them. The BPIP MAY read them, for example to
        confirm `PaymentType`.
      required: [iss, sub, azp, aud, jti, iat, exp, cnf, PaymentType, PaymentInstrument, InstructedAmount, CardAcceptor, IcpAuthorisation]
      properties:
        iss:
          type: string
          description: The API Hub's issuer identifier.
        sub:
          $ref: '#/components/schemas/AEUaeKycId'
        azp:
          type: string
          description: The BPIP the token was issued to — its Directory organisation identifier.
        aud:
          type: string
          description: >-
            Who accepts the token: the API Hub resource server of the
            customer's LFI when `PaymentType` is `Account`; the card scheme
            named in `PaymentInstrument` when it is `Card`.
        jti:
          type: string
          maxLength: 40
          description: Single-use. Marked used by whoever accepts the token.
        iat:
          type: number
        exp:
          type: number
          description: Short-lived — proposed 120 seconds after `iat`.
        cnf:
          type: object
          description: Copied from the ICP authorisation. Binds the token to the BPIP's transport certificate.
          required: ['x5t#S256']
          properties:
            x5t#S256:
              type: string
        PaymentType:
          type: string
          enum: [Account, Card]
        PaymentInstrument:
          $ref: '#/components/schemas/AEPaymentInstrument'
        InstructedAmount:
          $ref: '#/components/schemas/AEAmount'
        CardAcceptor:
          type: object
          description: The merchant details from the lookup request.
          properties:
            AcquirerIdentification:
              type: string
            MerchantIdentification:
              type: string
            TerminalIdentification:
              type: string
        DebtorAccount:
          description: Present when `PaymentType` is `Account`. The IBAN the LFI returned.
          allOf:
            - $ref: '#/components/schemas/AEDebtorAccount'
        IcpAuthorisation:
          description: The ICP authorisation presented on the lookup, embedded unchanged.
          allOf:
            - $ref: '#/components/schemas/AEIcpAuthorisation'

    AEEventSubscription:
      type: object
      description: >-
        Where the API Hub delivers payment status events for this payment.
        Mirrors the Open Finance `subscription.Webhook` object a TPP sends when
        creating a payment consent, because a biometric payment has no consent
        to carry it. When omitted, or when `IsActive` is `false`, no events are
        delivered and the BPIP polls instead.
      required: [Webhook]
      additionalProperties: false
      properties:
        Webhook:
          type: object
          required: [Url, IsActive]
          additionalProperties: false
          properties:
            Url:
              type: string
              format: uri
              maxLength: 500
              description: >-
                The BPIP's webhook endpoint for this payment's status events.
                MUST be `https`.
              example: https://bpip.example.com/webhooks/biopay
            IsActive:
              type: boolean
              description: Whether the API Hub sends payment status events to `Url`.
              example: true

    AEAmount:
      type: object
      additionalProperties: false
      required: [Amount, Currency]
      properties:
        Amount:
          type: string
          pattern: '^\d{1,13}\.\d{1,5}$'
          example: '149.50'
        Currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: AED

    AEDebtorAccount:
      type: object
      description: The customer's account registered for BioPay.
      additionalProperties: false
      required: [SchemeName, Identification]
      properties:
        SchemeName:
          type: string
          enum: [IBAN]
        Identification:
          type: string
          maxLength: 70
          example: AE070331234567890123456

    AEAaniCreditor:
      type: object
      description: The merchant's account, credited over AANI.
      additionalProperties: false
      required: [CreditorAccount]
      properties:
        CreditorAccount:
          type: object
          additionalProperties: false
          required: [SchemeName, Identification]
          properties:
            SchemeName:
              type: string
              enum: [IBAN, AANI.Alias, MobileNumber, EmiratesID]
            Identification:
              type: string
              maxLength: 70
              example: AE220331234567890876543
            Name:
              type: object
              properties:
                en: { type: string }
                ar: { type: string }
        CreditorAgent:
          type: object
          additionalProperties: false
          properties:
            SchemeName:
              type: string
              enum: [BICFI]
            Identification:
              type: string
              example: BARBAEAAXXX

    AEBiometricPaymentRequest:
      type: object
      additionalProperties: false
      required: [Data, Risk]
      properties:
        Data:
          type: object
          additionalProperties: false
          required: [uaeKycId, DebtorAccount, Instruction, Creditor, PaymentToken]
          properties:
            uaeKycId:
              $ref: '#/components/schemas/AEUaeKycId'
            DebtorAccount:
              description: >-
                The customer's account, exactly as `POST /instrument-lookup`
                returned it in `Data.DebtorAccount`. MUST equal the
                `DebtorAccount` bound in the payment token.
              allOf:
                - $ref: '#/components/schemas/AEDebtorAccount'
            Instruction:
              type: object
              additionalProperties: false
              required: [InstructionIdentification, EndToEndIdentification, InstructedAmount]
              properties:
                InstructionIdentification:
                  type: string
                  maxLength: 35
                EndToEndIdentification:
                  type: string
                  maxLength: 35
                InstructedAmount:
                  $ref: '#/components/schemas/AEAmount'
                RemittanceInformation:
                  type: object
                  additionalProperties: false
                  properties:
                    Reference:
                      type: string
                      maxLength: 35
                    Unstructured:
                      type: string
                      maxLength: 140
            Creditor:
              $ref: '#/components/schemas/AEAaniCreditor'
            PaymentToken:
              description: >-
                The payment token the lookup returned, with `PaymentType:
                Account`. `uaeKycId`, `DebtorAccount` and
                `Instruction.InstructedAmount` MUST equal the values bound in
                it.
              allOf:
                - $ref: '#/components/schemas/AEPaymentToken'
            Subscription:
              $ref: '#/components/schemas/AEEventSubscription'
        Risk:
          type: object
          additionalProperties: false
          required: [PaymentContextCode]
          properties:
            PaymentContextCode:
              type: string
              enum: [BiometricPointOfSale, BiometricUnattendedTerminal]
            MerchantCategoryCode:
              type: string
              pattern: '^\d{4}$'
              example: '5411'
            MerchantIdentification:
              type: string
              maxLength: 35
            MerchantName:
              type: string
            TerminalIdentification:
              type: string
              maxLength: 35

    AERailReference:
      type: object
      description: >-
        How the payment was represented on the rail that executed it. Populated
        by the LFI once the rail has responded.
      additionalProperties: false
      properties:
        Scheme:
          type: string
          description: The rail that executed the payment.
          example: AANI
        SchemeTransactionId:
          type: string
          maxLength: 70
        SchemeStatus:
          type: string
          description: >-
            The rail's own status value, carried through unmapped for
            reconciliation. The normalised value is `Status`.

    AEBiometricPayment:
      type: object
      additionalProperties: false
      required: [PaymentId, Status, CreationDateTime, StatusUpdateDateTime]
      properties:
        PaymentId:
          type: string
          maxLength: 40
        IdempotencyKey:
          type: string
          maxLength: 40
        Status:
          $ref: '#/components/schemas/AEPaymentStatus'
        CreationDateTime:
          type: string
          format: date-time
        StatusUpdateDateTime:
          type: string
          format: date-time
        uaeKycId:
          $ref: '#/components/schemas/AEUaeKycId'
        LFIIdentification:
          type: string
          example: altareq1
        Instruction:
          type: object
          description: Echo of the submitted instruction.
          additionalProperties: true
        RailReference:
          $ref: '#/components/schemas/AERailReference'
        StatusReason:
          $ref: '#/components/schemas/AEBiometricPaymentStatusReason'
        BiometricAssurance:
          $ref: '#/components/schemas/AEBiometricAssurance'

    AEBiometricPaymentStatusReason:
      type: object
      description: >-
        Why a payment ended where it did. Set by the LFI on the payment log
        patch and served back unchanged on the payment resource and the
        payment status event.
      additionalProperties: false
      properties:
        Code:
          type: string
          pattern: '^[A-Za-z]+\.[A-Za-z0-9]+$'
          description: >-
            Namespaced by where the payment was rejected: `LFI.` when the LFI
            rejected it before the rail (fraud, sanctions or AML screening —
            always `LFI.ScreeningRejected` — or account state, balance or
            limits); `AANI.` when AANI or the
            receiving bank rejected it, carrying the AANI reason code
            unchanged (e.g. `AANI.AM04` insufficient funds). The LFI MUST NOT
            move a rail code into the `LFI.` namespace, or the reverse.
          example: AANI.AM04
        Description:
          type: string
          description: >-
            A sanitised description that can be shown to the customer. MUST NOT
            reveal detection logic, a sanctions match or an internal case
            reference.

    AEBiometricPaymentLogPatch:
      type: object
      description: >-
        The fields an LFI may set on a biometric payment after creation. Only
        the status and what qualifies it: the instruction, the creditor and the
        biometric assurance were fixed when the payment was created and cannot
        be patched.
      additionalProperties: false
      required: [Status]
      properties:
        Status:
          $ref: '#/components/schemas/AEPaymentStatus'
        StatusUpdateDateTime:
          type: string
          format: date-time
          description: >-
            When the LFI observed this status. The Hub records its own receipt
            time where this is omitted.
        RailReference:
          $ref: '#/components/schemas/AERailReference'
        StatusReason:
          description: >-
            MUST be present when `Status` is `Rejected`, carrying the reason
            the BPIP needs in order to tell the customer whether another
            attempt is worthwhile.
          allOf:
            - $ref: '#/components/schemas/AEBiometricPaymentStatusReason'

    AEBiometricPaymentResponse:
      type: object
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          $ref: '#/components/schemas/AEBiometricPayment'
        Links:
          $ref: '#/components/schemas/AELinks'
        Meta:
          $ref: '#/components/schemas/AEMeta'

    AEBiometricPaymentQueryResponse:
      type: object
      description: >-
        Query result shape. `Data` holds zero or one payment — an empty array
        means no payment was created for that idempotency key.
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/AEBiometricPayment'
        Links:
          $ref: '#/components/schemas/AELinks'
        Meta:
          $ref: '#/components/schemas/AEMeta'

    AEBiometricPaymentStatusEventSigned:
      type: object
      description: >-
        Signed event envelope, copied from `AEWebhookEventSigned` in the
        published webhook template so that a BioPay event is verified exactly
        like every other Open Finance webhook. `iss` is the API Hub; `aud`
        holds the BPIP's client identifier.
      additionalProperties: false
      required: [iss, exp, nbf, message]
      properties:
        iss:
          type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1)'
        exp:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4)'
        nbf:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5)'
        aud:
          type: array
          items:
            type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3)'
        iat:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6)'
        jti:
          type: string
          description: Unique per delivery. The BPIP SHOULD reject a `jti` it has already processed.
        message:
          $ref: '#/components/schemas/AEBiometricPaymentStatusEvent'

    AEBiometricPaymentStatusEvent:
      type: object
      description: >-
        The `message` of the signed payment status event. `Data` replicates the
        payment resource as it stands after the change; `Meta` describes the
        event itself.
      additionalProperties: false
      required: [Data, Meta]
      properties:
        Data:
          $ref: '#/components/schemas/AEBiometricPayment'
        Meta:
          type: object
          additionalProperties: false
          required: [EventDateTime, EventResource, EventType, PaymentId]
          properties:
            EventDateTime:
              type: string
              format: date-time
            EventResource:
              type: string
              example: /biometric-payments/7130812d-4d81-4c68-8187-6358cfbce521
            EventType:
              type: string
              enum:
                - Resource.Updated
            PaymentId:
              type: string
              maxLength: 40
              description: >-
                The payment the event concerns. Occupies the position
                `ConsentId` holds in the published payment status event.

    AEInstrumentLookupRequest:
      type: object
      description: >-
        Instrument lookup request. Carries the identifier and the ICP
        authorisation ICP returned on resolution, and the transaction details
        that authorisation is bound to.
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          type: object
          additionalProperties: false
          required: [uaeKycId, InstructedAmount, CardAcceptor, IcpAuthorisation]
          properties:
            uaeKycId:
              $ref: '#/components/schemas/AEUaeKycId'
            IcpAuthorisation:
              description: >-
                The ICP authorisation for this transaction. Its `sub` MUST equal
                `uaeKycId`, and its `txn` MUST equal the hash of
                `InstructedAmount` and `CardAcceptor` below.
              allOf:
                - $ref: '#/components/schemas/AEIcpAuthorisation'
            InstructedAmount:
              description: >-
                The payment amount. Bound into the payment token, and used by
                the LFI to bind the card scheme cryptogram to the payment when
                the payment instrument is a card scheme.
              allOf:
                - $ref: '#/components/schemas/AEAmount'
            CardAcceptor:
              type: object
              description: >-
                The merchant's acceptance details. Always sent, because they are
                part of the transaction bound in the ICP authorisation's `txn`.
                When the payment instrument is a card scheme, the LFI binds the
                cryptogram to them and uses them to choose a scheme the
                merchant accepts for a co-badged card. Field set to be
                validated against each scheme's message definition.
              additionalProperties: false
              properties:
                AcquirerIdentification:
                  type: string
                  maxLength: 35
                MerchantIdentification:
                  type: string
                  maxLength: 35
                TerminalIdentification:
                  type: string
                  maxLength: 35

    AEInstrumentLookupResponse:
      type: object
      description: >-
        Instrument lookup response. Names the payment instrument, carries
        either the account details or a card scheme token and one-time
        cryptogram for that scheme, and the payment token the BPIP presents to
        make the payment. Never carries a card number (PAN).
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          type: object
          additionalProperties: false
          required: [uaeKycId, PaymentInstrument, PaymentToken]
          properties:
            uaeKycId:
              $ref: '#/components/schemas/AEUaeKycId'
            PaymentInstrument:
              $ref: '#/components/schemas/AEPaymentInstrument'
            PaymentToken:
              description: >-
                Minted by the API Hub once the LFI has answered, and added to
                the LFI's response. Present it once: on
                `POST /biometric-payments` when `PaymentType` is `Account`, or
                to the card scheme when it is `Card`.
              allOf:
                - $ref: '#/components/schemas/AEPaymentToken'
            DebtorAccount:
              description: >-
                Present when the instrument is an account. The BPIP sends it
                back unchanged on `POST /biometric-payments`.
              allOf:
                - $ref: '#/components/schemas/AEDebtorAccount'
            EncryptedCardCredential:
              type: string
              description: >-
                Present when the payment instrument is a card scheme. A compact
                JWE (`RSA-OAEP-256`, `A256GCM`), encrypted by the LFI to the
                BPIP's public encryption key registered in the Directory and
                identified by `kid` in the JWE header. Its plaintext is a JWS
                signed by the LFI (`PS256`) whose claims are
                `AECardCredential`. The API Hub proxies it unread, so card data
                never passes through the Hub in the clear. Only the BPIP can
                decrypt it, with its private key, and it verifies the inner JWS
                against the LFI's signing keys from the Directory.
              example: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoiYnBpcC1lbmMifQ...
        Meta:
          $ref: '#/components/schemas/AEMeta'

    AECardCredential:
      type: object
      description: >-
        The claims of the LFI-signed JWS inside `EncryptedCardCredential` in
        the instrument lookup response. Never sent unencrypted.
      additionalProperties: false
      required: [iss, aud, iat, exp, IcpTransactionId, CardSchemeToken, Cryptogram, ExpirationDateTime]
      properties:
        iss:
          type: string
          description: The LFI's issuer identifier.
        aud:
          type: string
          description: The BPIP's client identifier.
        iat:
          type: number
        exp:
          type: number
          description: No later than `ExpirationDateTime`.
        IcpTransactionId:
          type: string
          maxLength: 40
          description: >-
            The `jti` of the ICP authorisation this credential was issued
            against. The BPIP MUST check it equals the `jti` of the ICP
            authorisation it presented on the lookup.
        CardSchemeToken:
          type: string
          maxLength: 19
          description: >-
            A network token issued by the card scheme's token service — a
            substitute for the card number that only the scheme can map back to
            the card. Valid only on the scheme named in `PaymentInstrument`.
        Cryptogram:
          type: string
          description: >-
            A one-time cryptogram bound to the amount and card acceptor in the
            request and to the ICP authorisation's `jti`, for the BPIP to submit
            to the card scheme.
        ExpirationDateTime:
          type: string
          format: date-time
          description: When the cryptogram expires.

    AELinks:
      type: object
      additionalProperties: false
      required: [Self]
      properties:
        Self:
          type: string
          format: uri

    AEMeta:
      type: object
      additionalProperties: false
      properties:
        TotalPages:
          type: integer

    AEErrorResponse:
      type: object
      additionalProperties: false
      required: [Code, Errors]
      properties:
        Code:
          type: string
        Id:
          type: string
          description: Correlates to `x-fapi-interaction-id`.
        Message:
          type: string
        Errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [ErrorCode]
            properties:
              ErrorCode:
                type: string
              Message:
                type: string
              Path:
                type: string
