openapi: 3.0.3
info:
  title: 'UAE Open Finance · Consent Attestations (v2.2-draft)'
  version: 2.2.0-draft
  description: >
    DRAFT specification for **data deletion confirmation**, introduced in
    Standards v2.2 by OFP-005. This document is **not yet published** in the
    api-specs release: v2.2 is an unratified draft, and these paths will move
    into the three family specifications — account information, bank initiation,
    and insurance — when it is ratified. Do not build a production
    implementation against it.


    v2.2 adds an **append-only `attestations` sub-resource** to each
    consent. A TPP `POST`s an **Attestation Event** to confirm it has completed
    the review and deletion (or lawful retention) of the data it holds under a
    consent once that consent reaches a terminal status — `Revoked`, `Expired`,
    or `Consumed`. A TPP `GET`s the sub-resource to read the events it has posted.


    An Attestation Event is a single **atomic** event. It carries an envelope
    (`AttestationType`, the relevant date-times) and a `DataActions` array, with
    one entry per category of data the TPP holds — each stating whether that
    category was `Deleted`, `Retained`, `Anonymised`, or `ArchivedRestricted`,
    and, where retained, why and for how long.


    There is deliberately **no state model** and **no correction endpoint**: each
    `POST` records a new, immutable event, the API Hub applies no de-duplication,
    and all successfully recorded events are stored. Which event is surfaced in
    reporting is a reporting-layer matter, not consent state. The record's
    `AttestationType` is the extension point — a future obligation to attest to
    something else against a consent becomes a new type, not a new API.


    The same sub-resource applies to all three consent types: Bank Data Sharing,
    Bank Service Initiation, and Insurance.
  contact:
    name: UAE Open Finance
tags:
  - name: Bank Data Sharing Consent Attestations
  - name: Bank Service Initiation Consent Attestations
  - name: Insurance Consent Attestations

paths:
  # ────────────────────────────────────────────────────────────────────────────
  # Bank Data Sharing (Account Access)
  # ────────────────────────────────────────────────────────────────────────────
  /account-access-consents/{ConsentId}/attestations:
    post:
      tags:
        - Bank Data Sharing Consent Attestations
      summary: Append an Attestation Event to a Bank Data Sharing consent
      description: >
        Record a new, immutable Attestation Event against the consent identified
        by `ConsentId`. Used by the TPP to confirm it has completed its data
        review and deletion (or lawful retention) once the consent reached a
        terminal status — `Revoked`, `Expired`, or `Consumed`.
      operationId: PostAccountAccessConsentAttestation
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEAttestationEventRequest'
      responses:
        '201':
          description: The Attestation Event was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEAttestationEventResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - accounts
    get:
      tags:
        - Bank Data Sharing Consent Attestations
      summary: List the Attestation Events posted against a Bank Data Sharing consent
      description: >
        Retrieve the Attestation Events the TPP has posted against the consent
        identified by `ConsentId`, most recent first.
      operationId: GetAccountAccessConsentAttestations
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: The list of Attestation Events for the consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEAttestationEventList'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - accounts

  # ────────────────────────────────────────────────────────────────────────────
  # Bank Service Initiation (Payments)
  # ────────────────────────────────────────────────────────────────────────────
  /payment-consents/{ConsentId}/attestations:
    post:
      tags:
        - Bank Service Initiation Consent Attestations
      summary: Append an Attestation Event to a Bank Service Initiation consent
      description: >
        Record a new, immutable Attestation Event against a payment consent. A
        payment consent is not empty: it carries debtor and creditor account
        details, amounts, references, and charge and exchange-rate information,
        plus any account data the TPP retrieved to set the payment up. When the
        consent reaches a terminal status — `Revoked`, `Expired`, or `Consumed` —
        that data falls under the same deletion obligation as a Data Sharing
        consent.
      operationId: PostPaymentConsentAttestation
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEAttestationEventRequest'
      responses:
        '201':
          description: The Attestation Event was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEAttestationEventResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - payments
    get:
      tags:
        - Bank Service Initiation Consent Attestations
      summary: List the Attestation Events posted against a Bank Service Initiation consent
      operationId: GetPaymentConsentAttestations
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: The list of Attestation Events for the consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEAttestationEventList'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - payments

  # ────────────────────────────────────────────────────────────────────────────
  # Insurance (all insurance types)
  # ────────────────────────────────────────────────────────────────────────────
  /insurance-consents/{ConsentId}/attestations:
    post:
      tags:
        - Insurance Consent Attestations
      summary: Append an Attestation Event to an Insurance consent
      description: >
        Record a new, immutable Attestation Event against an insurance consent.
        Applies across every insurance type (for example Motor, Health, Home,
        Life, Travel), each carrying policy and claims data held under the consent.
      operationId: PostInsuranceConsentAttestation
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEAttestationEventRequest'
      responses:
        '201':
          description: The Attestation Event was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEAttestationEventResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - insurance
    get:
      tags:
        - Insurance Consent Attestations
      summary: List the Attestation Events posted against an Insurance consent
      operationId: GetInsuranceConsentAttestations
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: The list of Attestation Events for the consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEAttestationEventList'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - TPPOAuth2Security:
            - insurance

components:
  # ────────────────────────────────────────────────────────────────────────────
  parameters:
    ConsentId:
      name: ConsentId
      in: path
      required: true
      description: Unique identification of the consent the Attestation Event concerns.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Authorization:
      name: Authorization
      in: header
      required: true
      description: >
        Bearer token. This is the **same OAuth 2.0 client credentials access
        token a TPP already uses to create and retrieve the consent itself**
        (for example `GET /account-access-consents`). The `attestations`
        sub-resource is authorised exactly as the consent endpoints are, so no
        new authorisation flow is required and the call works unchanged after the
        consent has reached a terminal status.
      schema:
        type: string
    x-fapi-auth-date:
      name: x-fapi-auth-date
      in: header
      required: false
      schema:
        type: string
    x-fapi-customer-ip-address:
      name: x-fapi-customer-ip-address
      in: header
      required: false
      schema:
        type: string
    x-fapi-interaction-id:
      name: x-fapi-interaction-id
      in: header
      required: false
      description: An RFC4122 UID used as a correlation id.
      schema:
        type: string

  # ────────────────────────────────────────────────────────────────────────────
  securitySchemes:
    TPPOAuth2Security:
      type: oauth2
      description: >
        The same OAuth 2.0 client credentials grant a TPP uses to create and
        retrieve a consent (for example `POST` / `GET /account-access-consents`).
        Authorisation for the `attestations` sub-resource is identical to the
        consent endpoints themselves — the client credentials token, with the same
        scope as the parent consent. No consent-bound (`authorization_code` /
        customer) access token is used.
      flows:
        clientCredentials:
          tokenUrl: https://auth.openfinance.ae/token
          scopes:
            accounts: Bank Data Sharing consents
            payments: Bank Service Initiation consents
            insurance: Insurance consents

  # ────────────────────────────────────────────────────────────────────────────
  schemas:
    AEAttestationType:
      title: Attestation type
      description: >
        The kind of attestation being submitted against the consent. This is the
        extension point for the pattern: a future obligation to attest to
        something else against a consent is added here as a new value, without a
        new API. `DataRetentionDeletion` is the only value defined today.
      type: string
      enum:
        - DataRetentionDeletion

    AEDataActionType:
      title: Data action type
      description: >
        The action the TPP has taken for a category of data held under the
        consent. `Deleted` attests the data has been deleted; `Retained`,
        `Anonymised`, and `ArchivedRestricted` each attest the data is kept in
        some form (and require a retention reason, a retained-until date, and an
        access-restriction indicator).
      type: string
      enum:
        - Deleted
        - Retained
        - Anonymised
        - ArchivedRestricted

    AEDataCategory:
      title: Data category
      description: >
        The category of data to which a data action applies. Named values:
        `AllConsentedData` (used when every category for the consent shares the
        same action), `AnalyticsData` (data derived from consented data for
        analytics), and `AuditRecords` (records generated from data access that
        may contain elements of the consented data). Otherwise, a Permission Code
        from Bank Data Sharing or Insurance Data Sharing (for example `ReadParty`)
        may be supplied to qualify a specific category.
      type: string
      minLength: 1
      maxLength: 128

    AERetentionReason:
      title: Retention reason
      description: >
        Why a category of data is being retained. Required where the data action
        is `Retained`, `Anonymised`, or `ArchivedRestricted`.
      type: string
      enum:
        - RegulatoryOrLegalObligation
        - FraudSecurityOrCompliance
        - ComplaintOrDispute
        - ExplicitCustomerAgreement
        - UserRequestedHistory
        - AnonymisedOrAggregatedData
        - Other

    AEAccessRestriction:
      title: Access restriction
      description: >
        How access to retained data is restricted. Required where the data action
        is `Retained`, `Anonymised`, or `ArchivedRestricted`.
      type: string
      enum:
        - NotRestricted
        - RestrictedUseOnly
        - Other

    AEDataActionDeleted:
      title: Data action — Deleted
      description: The data in this category has been deleted by the TPP.
      type: object
      required:
        - AttestationType
        - DataCategory
        - AttestationDate
      additionalProperties: false
      properties:
        AttestationType:
          description: Fixed value `Deleted`.
          type: string
          enum:
            - Deleted
        DataCategory:
          $ref: '#/components/schemas/AEDataCategory'
        AttestationDate:
          description: >
            The date and time the attestation for this category is made. Must be
            in the past, later than `ConsentRevocationDateTime` (where set), and
            earlier than `AttestationStatusAppliedDateTime`.
          type: string
          format: date-time

    AEDataActionRetained:
      title: Data action — Retained / Anonymised / ArchivedRestricted
      description: >
        The data in this category is kept in some form. Requires a retention
        reason, the date until which it is retained, and an access-restriction
        indicator.
      type: object
      required:
        - AttestationType
        - DataCategory
        - AttestationDate
        - RetentionReason
        - RetainedUntilDate
        - AccessRestriction
      additionalProperties: false
      properties:
        AttestationType:
          description: One of `Retained`, `Anonymised`, or `ArchivedRestricted`.
          type: string
          enum:
            - Retained
            - Anonymised
            - ArchivedRestricted
        DataCategory:
          $ref: '#/components/schemas/AEDataCategory'
        AttestationDate:
          description: >
            The date and time the attestation for this category is made. Must be
            in the past, later than `ConsentRevocationDateTime` (where set), and
            earlier than `AttestationStatusAppliedDateTime`.
          type: string
          format: date-time
        RetentionReason:
          $ref: '#/components/schemas/AERetentionReason'
        RetentionReasonDescription:
          description: >
            Free-text reason for retention. Required (technical rule) where
            `RetentionReason` is `Other`.
          type: string
          minLength: 1
          maxLength: 500
        RetainedUntilDate:
          description: >
            The date until which the TPP will retain the data. Must be in the
            future.
          type: string
          format: date
        AccessRestriction:
          $ref: '#/components/schemas/AEAccessRestriction'
        AccessRestrictionDescription:
          description: >
            Free-text description of how access is restricted. Required (technical
            rule) where the action is `ArchivedRestricted` and `AccessRestriction`
            is `Other`.
          type: string
          minLength: 1
          maxLength: 500

    AEDataAction:
      title: Data action
      description: >
        The action taken by the TPP for one category of data held under the
        consent. `AttestationType` selects the shape: `Deleted` needs only the
        category and date; `Retained` / `Anonymised` / `ArchivedRestricted` also
        require a retention reason, retained-until date, and access restriction.
      oneOf:
        - $ref: '#/components/schemas/AEDataActionDeleted'
        - $ref: '#/components/schemas/AEDataActionRetained'
      discriminator:
        propertyName: AttestationType
        mapping:
          Deleted: '#/components/schemas/AEDataActionDeleted'
          Retained: '#/components/schemas/AEDataActionRetained'
          Anonymised: '#/components/schemas/AEDataActionRetained'
          ArchivedRestricted: '#/components/schemas/AEDataActionRetained'

    AEDataRetentionDeletionAttestation:
      title: Data retention / deletion attestation
      description: >
        The `Data` object for a `DataRetentionDeletion` Attestation Event. Carries
        the attestation envelope and the per-category `DataActions`. An event must
        list all `DataCategory` types that apply to the consent.
      type: object
      required:
        - AttestationType
        - AttestationStatusAppliedDateTime
        - DataAccessCeasedDateTime
        - DataActions
      additionalProperties: false
      properties:
        AttestationType:
          $ref: '#/components/schemas/AEAttestationType'
        AttestationStatusAppliedDateTime:
          description: >
            The date and time from which the attestation is valid. Must be in the
            past and later than `ConsentRevocationDateTime` (where set).
          type: string
          format: date-time
        DataAccessCeasedDateTime:
          description: >
            The date and time at which the TPP's data access ceased. Must be in
            the past.
          type: string
          format: date-time
        ConsentRevocationDateTime:
          description: >
            The date and time at which the customer revoked the consent at the
            TPP. Provided only where the consent was revoked at the TPP (not where
            it expired or was consumed). Must be in the past and earlier than the
            time at which the consent was revoked at the API Hub.
          type: string
          format: date-time
        DataActions:
          description: >
            One entry per category of data held under the consent. Must list all
            categories that apply.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AEDataAction'

    AEAttestationEventRequest:
      title: Attestation Event — request
      description: >
        The Attestation Event a TPP posts against a consent. `Data.AttestationType`
        selects the attestation; today the only value is `DataRetentionDeletion`.
      type: object
      required:
        - Data
      additionalProperties: false
      properties:
        Data:
          oneOf:
            - $ref: '#/components/schemas/AEDataRetentionDeletionAttestation'
          discriminator:
            propertyName: AttestationType
            mapping:
              DataRetentionDeletion: '#/components/schemas/AEDataRetentionDeletionAttestation'

    AEAttestationReceipt:
      title: Attestation Event — receipt
      description: >
        The receipt the API Hub returns for a recorded Attestation Event.
      type: object
      required:
        - AttestationId
        - AttestationReceivedDateTime
        - RegulatoryDeadlineMetIndicator
      additionalProperties: false
      properties:
        AttestationId:
          description: Unique identifier the API Hub assigns to the Attestation Event.
          type: string
          format: uuid
        AttestationReceivedDateTime:
          description: The date and time at which the API Hub received the Attestation Event.
          type: string
          format: date-time
        RegulatoryDeadlineMetIndicator:
          description: >
            Whether the API Hub received the Attestation Event before the
            regulatory deadline for the submitted `AttestationType` (for
            `DataRetentionDeletion`, 45 days after the consent reached its terminal
            status).
          type: boolean

    AEAttestationEventResponse:
      title: Attestation Event — response
      description: The receipt for a recorded Attestation Event.
      type: object
      required:
        - Data
      additionalProperties: false
      properties:
        Data:
          $ref: '#/components/schemas/AEAttestationReceipt'

    AEAttestationEventList:
      title: Attestation Event list
      description: >
        The Attestation Events posted against a consent, most recent first. Each
        item carries the submitted attestation together with its receipt. All
        successfully recorded events are stored; the API Hub applies no
        de-duplication.
      type: object
      required:
        - Data
      additionalProperties: false
      properties:
        Data:
          type: array
          items:
            type: object
            required:
              - Attestation
              - Receipt
            additionalProperties: false
            properties:
              Attestation:
                $ref: '#/components/schemas/AEDataRetentionDeletionAttestation'
              Receipt:
                $ref: '#/components/schemas/AEAttestationReceipt'

    AEErrorResponse:
      title: Error response
      description: >
        Returned with `400` when an Attestation Event fails a technical or rule
        validation. The error `Code` is `Attestation.ValidationError`. Schema
        violations (missing mandatory properties, bad enum values, malformed
        date-times) are rejected by schema validation and do not use this rule.
      type: object
      required:
        - Code
        - Message
      additionalProperties: false
      properties:
        Code:
          type: string
          example: Attestation.ValidationError
        Id:
          type: string
        Message:
          type: string
        Errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              ErrorCode:
                type: string
              Message:
                type: string

  # ────────────────────────────────────────────────────────────────────────────
  responses:
    400Error:
      description: >
        Bad request — the Attestation Event failed schema validation or a
        technical rule (`Attestation.ValidationError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    401Error:
      description: Unauthorised.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    403Error:
      description: Forbidden — the caller may not post against this consent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    404Error:
      description: The consent was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
