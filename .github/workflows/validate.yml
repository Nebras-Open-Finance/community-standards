name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npx -y npm@11 ci

      - name: Fetch data needed by typecheck and fast tests
        env:
          # Read-only PAT for cross-repo reads against Nebras-Open-Finance/api-specs.
          # Provisioned by terraform-controller (github/actions_secrets.tf).
          GITHUB_TOKEN: ${{ secrets.SPECS_READ_TOKEN }}
        run: |
          npm run fetch:orgs
          npm run fetch:specs
          npm run fetch:postman
          npm run build:search

      - name: Type-check
        run: npm run typecheck

      - name: Run fast tests
        run: npm run test:fast

  build-gate:
    name: build-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npx -y npm@11 ci

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          # Pin lychee — `supporting/lychee.toml` syntax (e.g. `include_fragments`)
          # tracks a specific major. Bump this in lockstep with config changes.
          tool: lychee@0.24.1

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.SPECS_READ_TOKEN }}
        run: npm run build

      - name: Strict internal-link check
        # Catches dead in-page links lychee misses — namely directory paths
        # whose folder exists in dist but contains no index.html.
        run: node --test supporting/tests/built-html-links.test.mjs

      - name: Internal-link check
        run: lychee --config supporting/lychee.toml --root-dir "$(pwd)/dist" dist

      - name: Upload built site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: deploy
    needs: [fast, build-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nebras-website --branch=main
