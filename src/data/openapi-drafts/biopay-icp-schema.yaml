# BioPay — DRAFT OpenAPI document for the third-party-facing surface.
#
# Every operation here is consumed by the authorised initiator (ICP, holding the
# BPIP role) against the API Hub, with one exception: the registration event,
# which the Hub POSTs to an endpoint ICP implements. Direction is stated in each
# operation description.
#
# One call in this journey is LFI → API Hub and deliberately NOT modelled here
# (see the third-party-facing-only scoping decision):
#   - the LFI posting a completed registration to the Hub
# It is described in prose on /biopay/technical-architecture.
#
# The other LFI → API Hub call, PATCH /biometrics-payment-log/{id}, IS
# modelled: it is how the payment status the initiator polls and is notified of
# comes to exist, so the third-party-facing surface cannot be read without it.
# It is served at the Consent Manager host, not at the rs1.* host the rest of
# this document uses.
#
# Nothing in this document is published. Field names, enum values, endpoint
# paths and status vocabulary are all proposals for review. The status values
# align with the published payments standard (Pending / AcceptedWithoutPosting /
# Accepted / Rejected) so BioPay does not invent a second vocabulary.
#
# Discovery follows the same pattern as the published Confirmation of Payee
# /discovery operation: a POST whose request and response are both signed JWTs
# (application/jwt), returning DiscoveryEndpointUrl and ResourceServerUrl for
# the LFI that holds the registration.
#
# The registration event follows the published webhook template: the same signed
# envelope, the same Data/Meta split under the message claim, the same
# Resource.Created/Updated/Deleted event types, delivered as application/jwe.
# Its Data is the discovery Data, so the event and discovery describe a
# registration identically.
#
# The payment operations still use unsigned JSON with a detached
# x-jws-signature header; whether they should move to the same signed-body
# pattern is an open item.

openapi: 3.0.3

info:
  title: BioPay — Biometric Payments (draft)
  version: 0.1.0-draft
  description: >-
    Draft third-party-facing API for BioPay: a payment journey in which a
    customer is identified biometrically by ICP, and ICP — as a specifically
    authorised initiator — initiates a payment through the API Hub under a
    `client_credentials` grant. No biometric, template or match score crosses
    into Open Finance. What crosses is an ICP user identifier and ICP's
    assertion that it identified the person.

servers:
  - url: https://rs1.[LFICODE].apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Production
  - url: https://rs1.[LFICODE].preprod.apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Pre-production
  - url: https://rs1.altareq1.sandbox.apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Sandbox

tags:
  - name: Registration
    description: Querying and being notified about a customer's BioPay registration.
  - name: Payment
    description: Initiating a biometric payment and tracking its status.
  - name: Payment log
    description: >-
      Reporting the outcome of a biometric payment. Called by the LFI, not by
      the initiator.

paths:
  # ═════════════════════════════════════════════════════════════════════════
  # REGISTRATION
  # ═════════════════════════════════════════════════════════════════════════
  /biometric-payments-discovery:
    post:
      tags: [Registration]
      operationId: postBiometricPaymentsDiscovery
      summary: Discover a customer's BioPay registration
      description: >-
        **ICP → API Hub.** Resolves an ICP user identifier to the registration
        the API Hub holds for it: whether that registration is live, which
        payment instrument(s) the customer selected, and the endpoints at which
        the initiator obtains a token for — and then calls — the LFI holding it.
        Answered by the API Hub from its own registration store; this call is
        **not** proxied to the LFI.


        Modelled on the published Confirmation of Payee `/discovery` operation,
        so that BioPay does not introduce a second discovery pattern. The
        request is a signed JWT whose `message` carries the identifier to
        resolve; the response is a signed JWT whose `message` carries the
        resolved registration and routing. Both directions are
        `application/jwt`, and the signature **is** the JWT — this operation
        carries no detached `x-jws-signature` header.


        Signing the request is also what allows the identifier to travel in a
        body rather than a query string, keeping it out of access and proxy
        logs. That is why this operation is a `POST`; the earlier draft modelled
        it as a `GET` with an `IcpUserId` query parameter and flagged the
        logging exposure as an open item.


        The initiator MUST call this before initiating a payment: a registration
        may have been suspended, revoked, or had its default instrument changed
        since the registration event was received. The initiator MUST address
        the payment call using the `ResourceServerUrl` returned here rather than
        a URL it derived itself.


        The registration event carries this same `Data`, so an initiator
        already holds the routing before it calls discovery. That overlap is
        deliberate and matches CoP: the event is how routing arrives, and
        discovery is how it is confirmed still current at the moment of
        payment. Open item: whether discovery should be callable at any
        LFI-scoped host, as CoP allows, rather than only at the host the
        registration resolved to.
      parameters:
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      requestBody:
        required: true
        content:
          application/jwt:
            schema:
              $ref: '#/components/schemas/DiscoverBiometricRegistrationRequestBodySigned'
      responses:
        '200':
          description: >-
            The registration state held by the API Hub, as a signed JWT. A `200`
            is returned for an unregistered identifier too, with
            `RegistrationStatus` set to `NotRegistered` and the routing fields
            absent — absence of a registration is a fact, not an error.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/DiscoverBiometricRegistrationResponseBodySigned'
        '400':
          description: >-
            The request was malformed or failed schema validation. A request
            whose JWT cannot be verified is reported with the signing error
            codes the Confirmation of Payee standard already defines —
            `JWS.InvalidSignature`, `JWS.Malformed`, `JWS.InvalidClaim`,
            `JWS.InvalidHeader` — rather than a BioPay-specific set.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/AEErrorResponseBodySigned'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            The client is authenticated but not entitled — typically a client
            whose application does not carry the BPIP role, or a token without
            the `biometric-payments` scope.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/AEErrorResponseBodySigned'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: An unexpected error occurred at the API Hub.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/AEErrorResponseBodySigned'

  /biometric-payment-registration-events:
    post:
      tags: [Registration]
      operationId: postBiometricPaymentRegistrationEvent
      summary: Registration event notification
      description: >-
        **API Hub → ICP.** The Hub delivers this event to the endpoint ICP
        registered in the Directory, after an LFI has posted a completed
        registration to the Hub. This is the mechanism by which ICP learns that
        an identity has a payment capability, **and where to address** that
        identity's subsequent discovery and payment calls.


        The path shown is illustrative — the real target is ICP's registered
        event endpoint.


        Structured as an Open Finance webhook, not as a BioPay-specific
        notification. The envelope, the `message` claim, and the `Data` / `Meta`
        split are those of the published webhook template used by the payment
        status, consent status and insurance status events; `EventType` uses the
        same `Resource.Created` / `Resource.Updated` / `Resource.Deleted`
        vocabulary rather than a BioPay-specific one. A suspension or revocation
        is therefore a `Resource.Updated` carrying the new `RegistrationStatus`
        in `Data`, not a distinct event type.


        `Data` carries the same schema the discovery operation returns, per the
        webhook convention that the `Data` object holds the resource that
        triggered the event. An initiator that processes this event holds
        everything discovery would tell it — including
        `DiscoveryEndpointUrl` and `ResourceServerUrl` — and still MUST call
        discovery before initiating a payment, to confirm the registration has
        not changed since.


        Open items: the published webhook `Meta` carries no event identifier, so
        de-duplication of retried deliveries rests on `RegistrationId` and
        `EventDateTime` — the earlier draft carried an `EventId` for this. And
        whether a revoked registration is reported as `Resource.Updated` with
        `RegistrationStatus: Revoked` or as `Resource.Deleted` with `Data`
        omitted is for review; both are expressible here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricRegistrationEventSigned'
          application/jwe:
            schema:
              type: string
        description: >-
          As with every other Open Finance webhook, the `application/json`
          Content Type is provided so the initiator can understand the payload it
          must parse; it does not reflect the wire format. The event is delivered
          as a serialised, signed and encrypted JWT with the Content Type
          `application/jwe`, signed by the API Hub and encrypted to the
          initiator's encryption certificate registered in the Trust Framework.
      responses:
        '202':
          description: >-
            Accepted. The initiator MUST acknowledge on receipt, with an empty
            body, and process asynchronously. The Hub retries on any non-2xx.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
        '204':
          description: No content. Accepted on the same terms as `202`.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }


  # ═════════════════════════════════════════════════════════════════════════
  # PAYMENT
  # ═════════════════════════════════════════════════════════════════════════
  /biometric-payments:
    post:
      tags: [Payment]
      operationId: createBiometricPayment
      summary: Initiate a biometric payment
      description: >-
        **ICP → API Hub → LFI.** Initiates a payment against a registered
        customer. There is no consent resource and no access-token subject: the
        customer's authority was established once, at registration, and is held
        by the API Hub. The Hub resolves the LFI from the registration record,
        validates the request against the schema for the named
        `PaymentInstrument`, and proxies to that LFI's Ozone Connect.


        The response is always `201` with `Status: Pending`. Execution on the
        rail is asynchronous; the LFI patches status to the Hub, which notifies
        the initiator and serves the updated resource on the GET operations.
      parameters:
        - $ref: '#/components/parameters/XIdempotencyKey'
        - $ref: '#/components/parameters/XJwsSignature'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricPaymentRequest'
      responses:
        '201':
          description: >-
            Payment accepted for execution. A replay of the same
            `x-idempotency-key` with an identical body returns the original
            resource and this same `201`, not a duplicate payment.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEBiometricPaymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            The `x-idempotency-key` has already been used with a different
            request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    get:
      tags: [Payment]
      operationId: getBiometricPaymentByIdempotencyKey
      summary: Retrieve a payment by idempotency key
      description: >-
        **ICP → API Hub.** Retrieves a payment by the `IdempotencyKey` the
        initiator supplied when creating it. This is the recovery path for a lost
        `201`: when the initiator does not know whether a payment was created, it
        queries by the key it generated rather than initiating again.


        Returns the single matching payment. When no payment exists for the key,
        the response is `200` with an empty `Data` array — the initiator can then
        safely retry the original request.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyQuery'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      responses:
        '200':
          description: Zero or one matching payment.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEBiometricPaymentQueryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /biometric-payments/{PaymentId}:
    get:
      tags: [Payment]
      operationId: getBiometricPayment
      summary: Retrieve a payment by PaymentId
      description: >-
        **ICP → API Hub.** Returns the current state of a payment. The API Hub
        serves the status it holds, last set by the LFI. Polling this operation
        is the pull alternative to the status webhook; an initiator MAY use
        either or both.
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      responses:
        '200':
          description: The payment resource.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEBiometricPaymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No payment exists with this `PaymentId` for this initiator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENT LOG — LFI → API Hub
  # ══════════════════════════════════════════════════════════════════════════
  # Served at the Consent Manager host (cm.{lfiCode}), not the rs1.* host the
  # operations above use. Modelled on the published Consent Manager operation
  # PATCH /payment-log/{id}, which is how an LFI reports the outcome of every
  # other Open Finance payment.
  /biometrics-payment-log/{id}:
    patch:
      tags: [Payment log]
      operationId: patchBiometricPaymentLog
      summary: Report the outcome of a biometric payment
      description: >-
        **LFI → API Hub.** Sets the status the API Hub holds for a biometric
        payment once the LFI knows how the rail responded. The Hub is the
        source of truth for payment state, and this is the only way that state
        changes after creation: nothing the initiator calls can move a payment
        out of `Pending`.


        Every biometric payment is created `Pending` and the LFI MUST patch it
        to a terminal status. One patch is the normal case — straight to
        `Accepted`, `AcceptedWithoutPosting` or `Rejected`. An LFI MAY patch
        more than once where the rail reports progress in stages, but MUST NOT
        patch a payment that has already reached a terminal status.


        The patch is what produces everything the initiator sees afterwards:
        the Hub records the new status, delivers the payment status event to
        the initiator's registered event endpoint, and serves the updated
        resource on `GET /biometric-payments/{PaymentId}` and
        `GET /biometric-payments`. An LFI that executes the payment but never
        patches leaves the initiator polling a payment that stays `Pending`
        forever.


        Modelled on the published Consent Manager operation
        `PATCH /payment-log/{id}`, and served at the same Consent Manager host,
        so an LFI already integrated with Open Finance is patching biometric
        payments the same way and from the same place as every other payment.


        Open items: the published operation names its fields in the dotted,
        lower-camel form `paymentResponse.status`, whereas this draft uses the
        flat PascalCase names the rest of the BioPay document uses — which
        convention wins is for review. And whether BioPay should reuse
        `PATCH /payment-log/{id}` outright rather than introduce a second
        payment log is open; it is modelled separately here because a biometric
        payment has no consent, and the published payment log is keyed to one.
      parameters:
        - $ref: '#/components/parameters/PaymentIdLogPath'
        - $ref: '#/components/parameters/XFapiInteractionId'
      requestBody:
        required: true
        description: >-
          The fields to set. Flat rather than `Data`-wrapped, following the
          published Consent Manager patch operations rather than the
          third-party-facing convention used elsewhere in this document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricPaymentLogPatch'
      responses:
        '204':
          description: >-
            The status was recorded. No body. Delivery of the payment status
            event to the initiator happens asynchronously and its outcome does
            not affect this response — a `204` means the Hub holds the new
            status, not that the initiator has received it.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            The authenticated LFI does not hold the payment identified by
            `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '404':
          description: No payment exists with this `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '409':
          description: >-
            The payment has already reached a terminal status, and the
            requested transition is not permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  # ── Parameters ───────────────────────────────────────────────────────────
  parameters:
    IdempotencyKeyQuery:
      name: IdempotencyKey
      in: query
      required: true
      description: >-
        The value the initiator sent in `x-idempotency-key` when creating the
        payment.
      schema:
        type: string
        maxLength: 40
    PaymentIdPath:
      name: PaymentId
      in: path
      required: true
      description: The API Hub's identifier for the payment.
      schema:
        type: string
        maxLength: 40
    PaymentIdLogPath:
      name: id
      in: path
      required: true
      description: >-
        The API Hub's identifier for the payment — the `PaymentId` the
        initiator was returned on creation. Named `id` rather than `PaymentId`
        to match the published Consent Manager operation
        `PATCH /payment-log/{id}`, which this one sits alongside.
      schema:
        type: string
        maxLength: 40
    XIdempotencyKey:
      name: x-idempotency-key
      in: header
      required: true
      description: >-
        Initiator-generated key that makes payment creation safely retryable.
        MUST be unique per payment and retained by the initiator long enough to
        support recovery via `GET /biometric-payments`.
      schema:
        type: string
        maxLength: 40
    XJwsSignature:
      name: x-jws-signature
      in: header
      required: true
      description: Detached JWS signature over the request body.
      schema:
        type: string
    XFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      required: false
      description: Correlation identifier, echoed on the response.
      schema:
        type: string
        format: uuid
    XFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      required: false
      description: >-
        The time of the biometric identification at ICP, in HTTP-date format.
      schema:
        type: string

  headers:
    XFapiInteractionId:
      description: Correlation identifier echoed from the request, or generated by the Hub.
      schema:
        type: string
        format: uuid

  # ── Responses ────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: The request was malformed or failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    Unauthorized:
      description: The access token is missing, expired or invalid.
    Forbidden:
      description: >-
        The client is authenticated but not entitled — typically a client whose
        application does not carry the BPIP role, or a token without the
        `biometric-payments` scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
    InternalServerError:
      description: An unexpected error occurred at the API Hub or the LFI.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'

  # ── Schemas ──────────────────────────────────────────────────────────────
  schemas:
    AEIcpUserId:
      type: string
      description: >-
        The identifier ICP issues for a verified identity, and the only
        identity-bearing value that crosses into Open Finance in this journey.
        Format to be confirmed.
      maxLength: 70
      example: ICP-7c9e1f4a-2b60-4d3e-9a15-0f8c2d1b7e43

    AEPaymentInstrument:
      type: string
      description: >-
        The payment vehicle the customer selected at registration. Determines
        which creditor schema the payment request MUST use. `JAYWAN` is the
        domestic card scheme (referred to as J1 elsewhere) — the final code is
        an open item.
      enum: [AANI, CBDC, JAYWAN]

    AERegistrationStatus:
      type: string
      description: >-
        `NotRegistered` means the Hub holds no registration for the identifier.
        `Suspended` means a registration exists but MUST NOT be used to initiate
        a payment.
      enum: [Registered, Suspended, Revoked, NotRegistered]

    AEPaymentStatus:
      type: string
      description: >-
        Aligned with the published payments standard rather than a
        BioPay-specific vocabulary. `Pending` on creation; the LFI moves it as
        the rail responds.
      enum: [Pending, AcceptedWithoutPosting, Accepted, Rejected]

    AEBiometricDiscoveryRequest:
      type: object
      description: >-
        The `message` of the signed discovery request. Carries only the
        identifier to resolve — the counterpart of the creditor account the
        Confirmation of Payee discovery request carries.
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          type: object
          additionalProperties: false
          required: [IcpUserId]
          properties:
            IcpUserId:
              $ref: '#/components/schemas/AEIcpUserId'

    AEDiscoveredInstrument:
      type: object
      description: >-
        An instrument the customer registered, as reported by discovery. The
        discovery answer is deliberately narrower than the registration event:
        it says what may be used and which is the default, and nothing else.
      additionalProperties: false
      required: [PaymentInstrument, Default]
      properties:
        PaymentInstrument:
          $ref: '#/components/schemas/AEPaymentInstrument'
        Default:
          type: boolean
          description: >-
            Exactly one returned instrument is the default. Whether an initiator
            may select a non-default instrument is an open item.

    AEBiometricRegistrationSourceProperties:
      type: object
      description: >-
        The resolved registration and the endpoints for acting on it. Mirrors
        `AEConfirmationSourceProperties` in the Confirmation of Payee standard,
        with the registration state and instruments added because BioPay
        discovery answers two questions at once: where to go, and whether to go
        at all.
      additionalProperties: false
      required: [IcpUserId, RegistrationStatus]
      properties:
        IcpUserId:
          $ref: '#/components/schemas/AEIcpUserId'
        RegistrationStatus:
          $ref: '#/components/schemas/AERegistrationStatus'
        DiscoveryEndpointUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            Discovery or .well-known endpoint hosted at the API Hub that
            provides the information to request an Access Token from the target
            LFI Authorisation Server. Present when `RegistrationStatus` is
            `Registered`; absent otherwise.
        ResourceServerUrl:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            API Hub resource server URL at which the biometric payment
            operation should be invoked for this registration. Present when
            `RegistrationStatus` is `Registered`; absent otherwise. This
            replaces the `LFIIdentification` the earlier draft returned — the
            initiator is given the address rather than a code to build one from.
        PaymentInstrument:
          type: array
          description: >-
            The instruments available for this registration. Present when
            `RegistrationStatus` is `Registered`; absent or empty otherwise.
          items:
            $ref: '#/components/schemas/AEDiscoveredInstrument'

    AEBiometricRegistrationDiscoveryResponse:
      type: object
      description: The `message` of the signed discovery response.
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          $ref: '#/components/schemas/AEBiometricRegistrationSourceProperties'
        Links:
          $ref: '#/components/schemas/AELinks'
        Meta:
          $ref: '#/components/schemas/AEMeta'


    AEBiometricRegistrationEventSigned:
      type: object
      description: >-
        Signed event envelope, copied from `AEWebhookEventSigned` in the
        published webhook template so that a BioPay event is verified exactly
        like every other Open Finance webhook. `iss` is the API Hub. Note that
        `aud` is an array here, where the discovery operation uses the
        single-audience string form — that difference exists between the
        published webhook and Confirmation of Payee standards and is carried
        through rather than resolved by BioPay.
      additionalProperties: false
      required: [iss, exp, nbf, message]
      properties:
        iss:
          type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1)'
        exp:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4)'
        nbf:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5)'
        aud:
          type: array
          items:
            type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3)'
        iat:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6)'
        message:
          $ref: '#/components/schemas/AEBiometricRegistrationEvent'

    AEBiometricRegistrationEvent:
      type: object
      description: >-
        The `message` of the signed registration event. `Data` and `Meta` follow
        the published webhook template: `Data` replicates the resource that
        triggered the event — here, the same properties discovery returns — and
        `Meta` describes the event itself. Only `Meta` is required, because the
        template omits `Data` when `EventType` is `Resource.Deleted`.
      additionalProperties: false
      required: [Meta]
      properties:
        Data:
          allOf:
            - $ref: '#/components/schemas/AEBiometricRegistrationSourceProperties'
          description: >-
            The registration as it stands after the event, in the same shape the
            discovery operation returns it. Omitted when `EventType` is
            `Resource.Deleted`.
        Meta:
          type: object
          additionalProperties: false
          required: [EventDateTime, EventResource, EventType, RegistrationId]
          properties:
            EventDateTime:
              type: string
              format: date-time
            EventResource:
              type: string
              description: >-
                The resource that triggered the event. Open item: BioPay does not
                expose the registration to the initiator as a fetchable resource
                — discovery is the read path — so what this carries needs
                deciding before the field is meaningful.
              example: /biometric-payment-registrations/9f14c0e2-63b7-4a1c-9f2e-58b0d4a6c711
            EventType:
              type: string
              description: >-
                The webhook template's vocabulary, unchanged. A suspension or
                revocation is a `Resource.Updated` whose `Data` carries the new
                `RegistrationStatus`.
              enum:
                - Resource.Created
                - Resource.Updated
                - Resource.Deleted
            RegistrationId:
              type: string
              minLength: 1
              maxLength: 40
              description: >-
                The API Hub's identifier for the registration the event concerns.
                Occupies the position `ConsentId` holds in the payment status
                event, and is the only identifier present when `Data` is omitted.


    AEBiometricAssurance:
      type: object
      description: >-
        ICP's assertion about the identification it performed. This is the
        evidence set for non-repudiation and dispute handling. It carries no
        biometric data, no template and no match score.
      additionalProperties: false
      required: [MatchMethod, MatchDateTime, IcpTransactionId]
      properties:
        MatchMethod:
          type: string
          enum: [Fingerprint, FacialImage, Palm]
        MatchDateTime:
          type: string
          format: date-time
        IcpTransactionId:
          type: string
          description: ICP's own reference for the identification event.
          maxLength: 40
        AssuranceLevel:
          type: string
          description: Identity assurance level asserted by ICP. Vocabulary to be confirmed.

    AEAmount:
      type: object
      additionalProperties: false
      required: [Amount, Currency]
      properties:
        Amount:
          type: string
          pattern: '^\d{1,13}\.\d{1,5}$'
          example: '149.50'
        Currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: AED

    AEAaniCreditor:
      type: object
      description: Creditor details for a payment executed over AANI.
      additionalProperties: false
      required: [CreditorType, CreditorAccount]
      properties:
        CreditorType:
          type: string
          enum: [AANI]
        CreditorAccount:
          type: object
          additionalProperties: false
          required: [SchemeName, Identification]
          properties:
            SchemeName:
              type: string
              enum: [IBAN, AANI.Alias, MobileNumber, EmiratesID]
            Identification:
              type: string
              maxLength: 70
              example: AE220331234567890876543
            Name:
              type: object
              properties:
                en: { type: string }
                ar: { type: string }
        CreditorAgent:
          type: object
          additionalProperties: false
          properties:
            SchemeName:
              type: string
              enum: [BICFI]
            Identification:
              type: string
              example: BARBAEAAXXX

    AEJaywanCreditor:
      type: object
      description: >-
        Creditor details for a payment executed over the Jaywan domestic card
        scheme. Field set is a first cut and needs validating against the
        scheme's own message definition.
      additionalProperties: false
      required: [CreditorType, AcquirerIdentification, MerchantIdentification]
      properties:
        CreditorType:
          type: string
          enum: [JAYWAN]
        AcquirerIdentification:
          type: string
          maxLength: 35
        MerchantIdentification:
          type: string
          maxLength: 35
        MerchantName:
          type: string
        TerminalIdentification:
          type: string
          maxLength: 35
        SettlementAccount:
          type: object
          additionalProperties: false
          properties:
            SchemeName:
              type: string
              enum: [IBAN]
            Identification:
              type: string

    AECbdcCreditor:
      type: object
      description: >-
        Creditor details for a payment executed in Digital Dirham. Wallet
        addressing is a placeholder pending the CBDC scheme definition.
      additionalProperties: false
      required: [CreditorType, CreditorWallet]
      properties:
        CreditorType:
          type: string
          enum: [CBDC]
        CreditorWallet:
          type: object
          additionalProperties: false
          required: [SchemeName, Identification]
          properties:
            SchemeName:
              type: string
              enum: [CBDC.WalletId]
            Identification:
              type: string
              maxLength: 70
            Name:
              type: object
              properties:
                en: { type: string }
                ar: { type: string }

    AEBiometricPaymentRequest:
      type: object
      additionalProperties: false
      required: [Data, Risk]
      properties:
        Data:
          type: object
          additionalProperties: false
          required: [IcpUserId, PaymentInstrument, Instruction, Creditor, BiometricAssurance]
          properties:
            IcpUserId:
              $ref: '#/components/schemas/AEIcpUserId'
            PaymentInstrument:
              $ref: '#/components/schemas/AEPaymentInstrument'
            Instruction:
              type: object
              additionalProperties: false
              required: [InstructionIdentification, EndToEndIdentification, InstructedAmount]
              properties:
                InstructionIdentification:
                  type: string
                  maxLength: 35
                EndToEndIdentification:
                  type: string
                  maxLength: 35
                InstructedAmount:
                  $ref: '#/components/schemas/AEAmount'
                RemittanceInformation:
                  type: object
                  additionalProperties: false
                  properties:
                    Reference:
                      type: string
                      maxLength: 35
                    Unstructured:
                      type: string
                      maxLength: 140
            Creditor:
              description: >-
                MUST match the `PaymentInstrument` named above, which in turn
                MUST be one the discovery response listed for a registration
                whose `RegistrationStatus` is `Registered`.
              oneOf:
                - $ref: '#/components/schemas/AEAaniCreditor'
                - $ref: '#/components/schemas/AEJaywanCreditor'
                - $ref: '#/components/schemas/AECbdcCreditor'
              discriminator:
                propertyName: CreditorType
                mapping:
                  AANI: '#/components/schemas/AEAaniCreditor'
                  JAYWAN: '#/components/schemas/AEJaywanCreditor'
                  CBDC: '#/components/schemas/AECbdcCreditor'
            BiometricAssurance:
              $ref: '#/components/schemas/AEBiometricAssurance'
        Risk:
          type: object
          additionalProperties: false
          required: [PaymentContextCode]
          properties:
            PaymentContextCode:
              type: string
              enum: [BiometricPointOfSale, BiometricUnattendedTerminal]
            MerchantCategoryCode:
              type: string
              pattern: '^\d{4}$'
              example: '5411'
            MerchantIdentification:
              type: string
              maxLength: 35
            MerchantName:
              type: string
            TerminalIdentification:
              type: string
              maxLength: 35

    AERailReference:
      type: object
      description: >-
        How the payment was represented on the rail that executed it. Populated
        by the LFI once the rail has responded.
      additionalProperties: false
      properties:
        Scheme:
          $ref: '#/components/schemas/AEPaymentInstrument'
        SchemeTransactionId:
          type: string
          maxLength: 70
        SchemeStatus:
          type: string
          description: >-
            The rail's own status value, carried through unmapped for
            reconciliation. The normalised value is `Status`.

    AEBiometricPayment:
      type: object
      additionalProperties: false
      required: [PaymentId, Status, CreationDateTime, StatusUpdateDateTime]
      properties:
        PaymentId:
          type: string
          maxLength: 40
        IdempotencyKey:
          type: string
          maxLength: 40
        Status:
          $ref: '#/components/schemas/AEPaymentStatus'
        CreationDateTime:
          type: string
          format: date-time
        StatusUpdateDateTime:
          type: string
          format: date-time
        IcpUserId:
          $ref: '#/components/schemas/AEIcpUserId'
        LFIIdentification:
          type: string
          example: altareq1
        PaymentInstrument:
          $ref: '#/components/schemas/AEPaymentInstrument'
        Instruction:
          type: object
          description: Echo of the submitted instruction.
          additionalProperties: true
        RailReference:
          $ref: '#/components/schemas/AERailReference'
        StatusReason:
          $ref: '#/components/schemas/AEBiometricPaymentStatusReason'

    AEBiometricPaymentStatusReason:
      type: object
      description: >-
        Why a payment ended where it did. Set by the LFI on the payment log
        patch and served back unchanged on the payment resource.
      additionalProperties: false
      properties:
        Code:
          type: string
        Description:
          type: string

    AEBiometricPaymentLogPatch:
      type: object
      description: >-
        The fields an LFI may set on a biometric payment after creation. Only
        the status and what qualifies it: the instruction, the creditor and the
        biometric assurance were fixed when the payment was created and cannot
        be patched.
      additionalProperties: false
      required: [Status]
      properties:
        Status:
          $ref: '#/components/schemas/AEPaymentStatus'
        StatusUpdateDateTime:
          type: string
          format: date-time
          description: >-
            When the LFI observed this status. The Hub records its own receipt
            time where this is omitted.
        RailReference:
          $ref: '#/components/schemas/AERailReference'
        StatusReason:
          description: >-
            MUST be present when `Status` is `Rejected`, carrying the reason
            the initiator needs in order to tell the customer whether another
            attempt is worthwhile.
          allOf:
            - $ref: '#/components/schemas/AEBiometricPaymentStatusReason'

    AEBiometricPaymentResponse:
      type: object
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          $ref: '#/components/schemas/AEBiometricPayment'
        Links:
          $ref: '#/components/schemas/AELinks'
        Meta:
          $ref: '#/components/schemas/AEMeta'

    AEBiometricPaymentQueryResponse:
      type: object
      description: >-
        Query result shape. `Data` holds zero or one payment — an empty array
        means no payment was created for that idempotency key.
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/AEBiometricPayment'
        Links:
          $ref: '#/components/schemas/AELinks'
        Meta:
          $ref: '#/components/schemas/AEMeta'

    # ── Signed JWT envelopes ───────────────────────────────────────────────
    # Claim set and required fields are copied from the Confirmation of Payee
    # standard's *BodySigned schemas so the two discovery operations are signed
    # and verified the same way. `message` holds the payload; `iss` is the
    # signer, and the initiator verifies the response against the API Hub's
    # signing key published at its JWKS endpoint.

    DiscoverBiometricRegistrationRequestBodySigned:
      type: object
      description: Signed by the initiator (ICP) and sent as `application/jwt`.
      additionalProperties: false
      required: [iss, exp, nbf, message]
      properties:
        iss:
          type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1)'
        exp:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4)'
        nbf:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5)'
        aud:
          type: string
          description: >-
            The identifier of the intended recipient of the JWT. A single
            StringOrURI per RFC 7519 §4.1.3 (single-audience form).
            [https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3)
        iat:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6)'
        message:
          $ref: '#/components/schemas/AEBiometricDiscoveryRequest'

    DiscoverBiometricRegistrationResponseBodySigned:
      type: object
      description: Signed by the API Hub and returned as `application/jwt`.
      additionalProperties: false
      required: [iss, exp, nbf, message]
      properties:
        iss:
          type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1)'
        exp:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4)'
        nbf:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5)'
        aud:
          type: string
          description: >-
            The identifier of the intended recipient of the JWT. A single
            StringOrURI per RFC 7519 §4.1.3 (single-audience form).
            [https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3)
        iat:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6)'
        message:
          $ref: '#/components/schemas/AEBiometricRegistrationDiscoveryResponse'

    AEErrorResponseBodySigned:
      type: object
      description: >-
        Signed error body, returned as `application/jwt` by operations whose
        success responses are signed. Operations with unsigned JSON responses
        return `AEErrorResponse` directly.
      additionalProperties: false
      required: [iss, exp, nbf, message]
      properties:
        iss:
          type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1)'
        exp:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4)'
        nbf:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5)'
        aud:
          type: string
          description: >-
            The identifier of the intended recipient of the JWT. A single
            StringOrURI per RFC 7519 §4.1.3 (single-audience form).
            [https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3)
        iat:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6)'
        message:
          $ref: '#/components/schemas/AEErrorResponse'


    AELinks:
      type: object
      additionalProperties: false
      required: [Self]
      properties:
        Self:
          type: string
          format: uri

    AEMeta:
      type: object
      additionalProperties: false
      properties:
        TotalPages:
          type: integer

    AEErrorResponse:
      type: object
      additionalProperties: false
      required: [Code, Errors]
      properties:
        Code:
          type: string
        Id:
          type: string
          description: Correlates to `x-fapi-interaction-id`.
        Message:
          type: string
        Errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [ErrorCode]
            properties:
              ErrorCode:
                type: string
              Message:
                type: string
              Path:
                type: string
