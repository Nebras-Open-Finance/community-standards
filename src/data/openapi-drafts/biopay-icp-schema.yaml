# BioPay — DRAFT OpenAPI document for the third-party-facing surface.
#
# Every operation here is consumed by the Biometric Payment Initiation Provider
# (BPIP) — the merchant's acquirer — against the API Hub, with two exceptions:
#   - the payment status event, which the Hub POSTs to an endpoint the BPIP
#     implements, and
#   - PATCH /biometrics-payment-log/{id}, which the LFI calls on the Hub.
# Direction is stated in each operation description.
#
# Identity resolution is NOT modelled here. The BPIP resolves the customer
# directly with ICP through the ICP SDK, outside the API Hub, and receives the
# uaeKycId, the customer's default LFI and an ICP token: a JWS signed by ICP and
# bound to this transaction. The ICP token is presented once, on
# POST /instrument-lookup. The API Hub proxies it to the LFI, which validates it
# with an online call to ICP. The LFI always answers with a payment token: a
# short-lived, single-use JWS signed by the LFI that embeds the ICP token and
# carries the amount and the payment instrument, encrypted as a JWE to the
# BPIP. The payment token — not the ICP token — is what the BPIP passes back
# to the LFI to make the payment: on POST /biometric-payments for an account,
# with only the creditor account alongside it, or in the card authorisation
# through the card scheme (e.g. Jaywan) for a card. The LFI verifies its own
# token in both cases. See AEIcpToken and AEPaymentToken.
#
# PATCH /biometrics-payment-log/{id} is modelled because it is how the payment
# status the BPIP polls and is notified of comes to exist. It is served at the
# Consent Manager host, not at the rs1.* host the rest of this document uses.
#
# Nothing in this document is published. Field names, enum values, endpoint
# paths and status vocabulary are all proposals for review. The status values
# and reject-reason namespaces are those of Open Finance domestic payments
# (see /tech/lfi-api-hub/v2.1/banking/service-initiation/domestic-payments/
# overview/payment-status) so BioPay does not invent a second vocabulary.
#
# The payment status event follows the published webhook template: the same
# signed envelope, the same Data/Meta split under the message claim, the same
# Resource.Created/Updated/Deleted event types, delivered as application/jwe.
#
# The request operations use unsigned JSON with a detached x-jws-signature
# header; whether they should move to a signed-body pattern is an open item.

openapi: 3.0.3

info:
  title: BioPay — Biometric Payments (draft)
  version: 0.1.0-draft
  description: >-
    Draft third-party-facing API for BioPay: a payment journey in which a
    customer is identified biometrically by ICP, and a Biometric Payment
    Initiation Provider (BPIP) — the merchant's acquirer — looks up the
    customer's payment instrument and initiates the payment through the API
    Hub under a `client_credentials` grant. No biometric, template or match
    score crosses into Open Finance. What crosses is a `uaeKycId` and ICP's
    signed token that it identified the person for this transaction, which
    the LFI validates with ICP and embeds in a single-use payment token it
    signs.

servers:
  - url: https://rs1.[LFICODE].apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Production
  - url: https://rs1.[LFICODE].preprod.apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Pre-production
  - url: https://rs1.altareq1.sandbox.apihub.openfinance.ae/open-finance/biometric-payments/v1
    description: Sandbox

tags:
  - name: Instrument lookup
    description: >-
      Asking the LFI which payment instrument a registered customer pays
      with, before the BPIP chooses a rail. Called on every payment.
  - name: Payment
    description: Initiating an account-to-account biometric payment and tracking its status.
  - name: Payment status event
    description: >-
      Notifying the BPIP of a change in a payment's status. Delivered by the
      API Hub to an endpoint the BPIP implements.
  - name: Payment log
    description: >-
      Reporting the outcome of a biometric payment. Called by the LFI, not by
      the BPIP.

paths:
  # ═════════════════════════════════════════════════════════════════════════
  # PAYMENT
  # ═════════════════════════════════════════════════════════════════════════
  /biometric-payments:
    post:
      tags: [Payment]
      operationId: createBiometricPayment
      summary: Initiate a biometric payment
      description: >-
        **BPIP → API Hub → LFI.** Initiates an account-to-account payment over
        AANI against a registered customer, after `POST /instrument-lookup` has
        returned a payment token with `InstrumentType: ACCOUNT`. Only an
        `ACCOUNT` token is accepted. There is no consent resource and no access-token
        subject: the customer's standing authority was established at
        registration, and their authority for **this** payment is the payment
        token the LFI issued on the lookup, carried in `Data.PaymentToken`.


        The request carries only the payment token and the creditor. The
        payment token already carries the `uaeKycId`, the `DebtorAccount` and
        the `InstructedAmount` as the LFI signed them, and the request does not
        repeat them. `Data.CreditorAccount` is the IBAN to credit. It is not in
        the payment token: the BPIP supplies it, and is accountable for it, as
        an acquirer is for settling with its merchant in a card payment.


        The API Hub checks entitlement, validates the request against its
        schema, enforces idempotency, and proxies to the LFI's Ozone Connect.
        It does not verify the payment token. The LFI verifies the token it
        issued: its own signature; that it has not expired; that
        `InstrumentType` is `ACCOUNT`; that `azp` is the calling BPIP, as identified by the Hub in
        `o3-caller-org-id`; and that its `jti` has not been used. The LFI MUST
        reject the payment if the token's `DebtorAccount` is no longer the
        account registered for BioPay against its `uaeKycId`. The LFI debits
        `DebtorAccount` for `InstructedAmount`, both from the token, and
        credits `Data.CreditorAccount`. Once the LFI has created the payment,
        the Hub records the biometric assurance — ICP's match method, time and
        identification reference — from the ICP token embedded in the payment
        token, for dispute handling and supervision. It is not returned on the
        payment resource.


        The LFI marks the payment token's `jti` used when it creates the
        payment; if the LFI returns an error, no payment exists and the token
        remains usable until it expires. A retry with the same
        `x-idempotency-key` and identical body is answered by the Hub with the
        original payment; any other reuse is rejected. This is the recovery
        path for a lost `201`: the BPIP retries rather than initiating again.


        Account state is checked before the payment is created, and a blocked
        or closed account is returned as a `403`. The LFI's fraud, sanctions
        and AML screening and its balance check run after creation; their
        outcome is a `Rejected` status with a `RejectReasonCode`, delivered by
        the payment status event and on `GET /biometric-payments/{PaymentId}`.


        Card payments do not use this operation. For a card, the BPIP submits
        the authorisation to the card scheme with the card details from the
        payment token, and the payment token itself.


        The response is always `201` with `Status: Pending`. Execution on the
        rail is asynchronous; the LFI patches status to the Hub, which serves
        the updated resource on `GET /biometric-payments/{PaymentId}` and, where the request
        carried an active `Data.Subscription.Webhook`, sends a payment status
        event to its `Url`.
      parameters:
        - $ref: '#/components/parameters/XIdempotencyKey'
        - $ref: '#/components/parameters/XJwsSignature'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricPaymentRequest'
      responses:
        '201':
          description: >-
            Payment accepted for execution. Always `Status: Pending`: the
            payment has not been submitted to a rail yet, so it carries no
            `PaymentRail`, `PaymentTransactionId` or `RejectReasonCode`. A
            replay of the same `x-idempotency-key` with an identical body
            returns the original `201`, not a duplicate payment; the current
            status is on `GET /biometric-payments/{PaymentId}`.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEBiometricPaymentCreatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/BiometricPaymentForbidden' }
        '409':
          description: >-
            The `x-idempotency-key` has already been used with a different
            request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /biometric-payments/{PaymentId}:
    get:
      tags: [Payment]
      operationId: getBiometricPayment
      summary: Retrieve a payment by PaymentId
      description: >-
        **BPIP → API Hub.** Returns the current state of a payment. The API Hub
        serves the status it holds, last set by the LFI. Polling this operation
        is the pull alternative to the payment status event; a BPIP MAY use
        either or both.


        The resource mirrors `Data` of the `POST /biometric-payments` request —
        `PaymentToken`, `CreditorAccount`, `PaymentPurposeCode`,
        `DebtorReference`, `CreditorReference` and `Subscription`, as the BPIP
        sent them — with `PaymentId`, `Status`, `CreationDateTime` and
        `StatusUpdateDateTime`. It is `Pending` until the LFI patches it; from
        then on `PaymentRail` and `Status` select its shape, exactly as they
        select the `PATCH /biometrics-payment-log/{id}` body — with
        `PaymentTransactionId` on `AANI`, and `RejectReasonCode` only when
        `Rejected`.
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      responses:
        '200':
          description: The payment resource.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEBiometricPaymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No payment exists with this `PaymentId` for this BPIP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ══════════════════════════════════════════════════════════════════════════
  # INSTRUMENT LOOKUP
  # ══════════════════════════════════════════════════════════════════════════
  /instrument-lookup:
    post:
      tags: [Instrument lookup]
      operationId: postInstrumentLookup
      summary: Look up a customer's payment instrument
      description: >-
        **BPIP → API Hub → LFI.** Called on every payment. After resolving the
        customer with ICP, the BPIP asks the LFI which payment instrument it
        holds for the `uaeKycId`, and receives in the same response what it
        needs for that instrument: for an `ACCOUNT`, the IBAN, which the LFI
        debits when the BPIP sends the payment token on
        `POST /biometric-payments`; for a `CARD`, the card details, which it
        submits to the card scheme as acquirer. A card payment does not return
        to the API Hub after the lookup.


        The request carries the ICP token in `Data.IcpToken`, with the
        `uaeKycId` and the amount it is bound to. The API Hub checks entitlement and
        the request schema, and proxies the request to the Ozone Connect
        endpoint of the default LFI ICP returned. It does not verify the ICP
        token. The LFI MUST validate it by calling ICP's token validation
        endpoint, at which ICP confirms that it issued the token, that it has
        not expired and that its `jti` has not been used, and marks it used.
        The LFI MUST also check that `azp` is the calling BPIP, as identified
        by the Hub in `o3-caller-org-id`; that `sub` equals `Data.uaeKycId`;
        and that `txn` equals the hash of `Data.TransactionAmount`. The LFI
        answers from its own registration store of `uaeKycId` → payment
        instrument.


        The response to a successful lookup is always a **payment token**, in
        `Data`: a short-lived, single-use JWS signed by the LFI, whose claims
        are `AEPaymentToken`. It carries the `uaeKycId`, the ICP token
        unchanged, the amount from the request as `InstructedAmount`, and —
        selected by `InstrumentType` — the
        `DebtorAccount` for an `ACCOUNT` or the `CardDetails` for a `CARD`. The LFI
        encrypts the JWS as a JWE to the BPIP's public encryption key from the
        Directory (`AEJWEPaymentToken`), so the API Hub proxies the response
        without reading it and card data never passes through the Hub in the
        clear. The BPIP decrypts it and passes the JWS back to the LFI at the
        point of payment — on `POST /biometric-payments` for an `ACCOUNT`, or
        in the card authorisation through the card scheme for a `CARD` — and the LFI
        relies on its own signature to make the payment.


        A `POST` rather than a `GET`, so that the `uaeKycId` travels in the
        body and stays out of access and proxy logs. The lookup creates no
        resource.


        For an `ACCOUNT`, the registered account can change between the lookup and
        the payment, so the subsequent payment request can still fail with
        `Account.DebtorAccountMismatch`.
      parameters:
        - $ref: '#/components/parameters/XJwsSignature'
        - $ref: '#/components/parameters/XFapiInteractionId'
        - $ref: '#/components/parameters/XFapiAuthDate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEInstrumentLookupRequest'
      responses:
        '200':
          description: >-
            The payment token for the payment instrument the LFI holds for the
            customer, encrypted to the BPIP.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEInstrumentLookupResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/IcpTokenRejected' }
        '404':
          description: >-
            The LFI holds no live BioPay registration for this `uaeKycId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENT STATUS EVENT — API Hub → BPIP
  # ══════════════════════════════════════════════════════════════════════════
  /biometric-payment-status-events:
    post:
      tags: [Payment status event]
      operationId: postBiometricPaymentStatusEvent
      summary: Payment status event notification
      description: >-
        **API Hub → BPIP.** Delivered to the `Data.Subscription.Webhook.Url`
        the BPIP gave on `POST /biometric-payments`, each time the LFI patches
        the status of that payment, provided `IsActive` was `true`. The path
        shown is illustrative — the real target is that URL.


        Structured as an Open Finance webhook. The envelope, the `message`
        claim and the `Data` / `Meta` split are those of the published payment
        status event; `Data` is the payment resource as it stands after the
        change, in the same shape `GET /biometric-payments/{PaymentId}`
        returns. `Meta` carries `PaymentId` in the position `ConsentId` holds in
        the published event, because a biometric payment has no consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricPaymentStatusEventSigned'
          application/jwe:
            schema:
              type: string
        description: >-
          As with every other Open Finance webhook, the `application/json`
          Content Type is provided so the BPIP can understand the payload it
          must parse; it does not reflect the wire format. The event is
          delivered as a serialised, signed and encrypted JWT with the Content
          Type `application/jwe`, signed by the API Hub and encrypted to the
          BPIP's encryption certificate registered in the Directory.
      responses:
        '202':
          description: >-
            Accepted. The BPIP MUST acknowledge on receipt, with an empty
            body, and process asynchronously. The Hub retries on any non-2xx.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENT LOG — LFI → API Hub
  # ══════════════════════════════════════════════════════════════════════════
  # Served at the Consent Manager host (cm.{lfiCode}), not the rs1.* host the
  # operations above use. Modelled on the published Consent Manager operation
  # PATCH /payment-log/{id}, which is how an LFI reports the outcome of every
  # other Open Finance payment.
  /biometrics-payment-log/{id}:
    patch:
      tags: [Payment log]
      operationId: patchBiometricPaymentLog
      summary: Report the outcome of a biometric payment
      description: >-
        **LFI → API Hub.** Sets the status the API Hub holds for a biometric
        payment once the LFI knows how the rail responded. The Hub is the
        source of truth for payment state, and this is the only way that state
        changes after creation: nothing the BPIP calls can move a payment
        out of `Pending`.


        Aligned with the v2.2 Consent Manager operation
        `PATCH /payment-log/{id}` — the same body, field names and rules —
        limited to the `AANI` and `LFI` rails, and served at the same Consent
        Manager host, so an LFI already integrated with Open Finance is
        patching biometric payments the same way and from the same place as
        every other payment.


        Every biometric payment is created `Pending` and the LFI MUST patch it
        to a terminal status. `paymentResponse.paymentRail` (`AANI` or `LFI`)
        and `paymentResponse.status` select the body — see the request body
        schema for what each allows. `Pending` is not a patchable status, and
        the LFI MUST NOT patch a payment that has already reached a terminal
        status.


        The patch is what produces everything the BPIP sees afterwards:
        the Hub records the new status, delivers the payment status event to
        the BPIP's webhook URL for the payment, and serves the updated
        resource on `GET /biometric-payments/{PaymentId}`, where
        `paymentResponse.paymentRail`, `paymentResponse.paymentTransactionId`
        and `paymentResponse.rejectReasonCode` appear as `PaymentRail`,
        `PaymentTransactionId` and `RejectReasonCode`. An LFI that executes
        the payment but never patches leaves the BPIP polling a payment that
        stays `Pending` forever.


        Open item: whether BioPay should reuse `PATCH /payment-log/{id}`
        outright rather than introduce a second payment log. It is modelled
        separately here because a biometric payment has no consent, and the
        published payment log is keyed to one.
      parameters:
        - $ref: '#/components/parameters/PaymentIdLogPath'
        - $ref: '#/components/parameters/XFapiInteractionId'
      requestBody:
        required: true
        description: >-
          The fields to set. Flat rather than `Data`-wrapped, with the dotted
          field names of the published Consent Manager operation, rather than
          the BPIP-facing convention used elsewhere in this document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AEBiometricPaymentLogPatch'
      responses:
        '204':
          description: >-
            The status was recorded. No body. Delivery of the payment status
            event to the BPIP happens asynchronously and its outcome does
            not affect this response — a `204` means the Hub holds the new
            status, not that the BPIP has received it.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/XFapiInteractionId'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            The authenticated LFI does not hold the payment identified by
            `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '404':
          description: No payment exists with this `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '409':
          description: >-
            The payment has already reached a terminal status, and the
            requested transition is not permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  # ── Parameters ───────────────────────────────────────────────────────────
  parameters:
    PaymentIdPath:
      name: PaymentId
      in: path
      required: true
      description: The API Hub's identifier for the payment.
      schema:
        type: string
        maxLength: 40
    PaymentIdLogPath:
      name: id
      in: path
      required: true
      description: >-
        The API Hub's identifier for the payment — the `PaymentId` the
        BPIP was returned on creation. Named `id` rather than `PaymentId`
        to match the published Consent Manager operation
        `PATCH /payment-log/{id}`, which this one sits alongside.
      schema:
        type: string
        maxLength: 40
    XIdempotencyKey:
      name: x-idempotency-key
      in: header
      required: true
      description: >-
        BPIP-generated key that makes payment creation safely retryable.
        MUST be unique per payment and retained by the BPIP until the payment
        reaches a final status, so that a lost response is recovered by
        retrying with the same key and an identical body.
      schema:
        type: string
        maxLength: 40
    XJwsSignature:
      name: x-jws-signature
      in: header
      required: true
      description: Detached JWS signature over the request body.
      schema:
        type: string
    XFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      required: false
      description: Correlation identifier, echoed on the response.
      schema:
        type: string
        format: uuid
    XFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      required: false
      description: >-
        The time of the biometric identification at ICP, in HTTP-date format.
      schema:
        type: string

  headers:
    XFapiInteractionId:
      description: Correlation identifier echoed from the request, or generated by the Hub.
      schema:
        type: string
        format: uuid

  # ── Responses ────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: The request was malformed or failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    Unauthorized:
      description: The access token is missing, expired or invalid.
    Forbidden:
      description: >-
        The client is authenticated but not entitled — typically a client whose
        application does not carry the BPIP role, or a token without the
        `biometric-payments` scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
    IcpTokenRejected:
      description: >-
        The client is not entitled, or the LFI rejected the ICP token.
        Entitlement failures are those of every BioPay operation, checked by
        the API Hub — a client whose application does not carry the BPIP role,
        or a token without the `biometric-payments` scope. ICP token failures
        are found by the LFI's online validation with ICP and its own binding
        checks, and are reported with one of the following `ErrorCode` values
        (proposed): `IcpToken.Invalid` (ICP did not confirm it issued the
        token, or the token was altered), `IcpToken.Expired`,
        `IcpToken.BindingMismatch` (`azp`, `sub` or `txn` does not match the
        request), `IcpToken.AlreadyUsed` (already used on a lookup).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    BiometricPaymentForbidden:
      description: >-
        The client is not entitled, the LFI rejected the payment token, or the
        LFI cannot debit the customer's account. No payment is created.
        Payment token failures use one of the following `ErrorCode` values
        (proposed): `PaymentToken.InvalidSignature` (not signed by the LFI, or
        altered), `PaymentToken.Expired`,
        `PaymentToken.WrongInstrumentType` (a `CARD` token was presented),
        `PaymentToken.BindingMismatch` (`azp` is not the calling BPIP),
        `PaymentToken.AlreadyUsed`. Account failures use one of the following
        `ErrorCode` values (proposed; the BioPay counterparts of the Open
        Finance `Consent.*` account codes, renamed because BioPay has no
        consent): `Account.TemporarilyBlocked` (the account is Inactive,
        Dormant or Suspended), `Account.PermanentAccessFailure` (Closed,
        Deceased or Unclaimed), `Account.TransientAccessFailure` (temporarily
        inaccessible), `Account.DebtorAccountMismatch` (the payment token's
        `DebtorAccount` is no longer the account registered for BioPay against
        its `uaeKycId` — for example, the customer changed it after the
        lookup).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'
    InternalServerError:
      description: >-
        An unexpected error occurred at the API Hub or the LFI. `ErrorCode` is
        `GenericRecoverableError` where a retry may succeed, otherwise
        `GenericError`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AEErrorResponse'

  # ── Schemas ──────────────────────────────────────────────────────────────
  schemas:
    AEUaeKycId:
      type: string
      description: >-
        The identifier ICP issues for a verified identity, and the only
        identity-bearing value that crosses into Open Finance in this journey.
        Format to be confirmed.
      maxLength: 70
      example: ICP-7c9e1f4a-2b60-4d3e-9a15-0f8c2d1b7e43

    AEIcpToken:
      type: string
      description: >-
        A compact JWS signed by ICP, returned to the BPIP through the ICP SDK
        when ICP identifies the customer. Its claims are `AEIcpTokenClaims`.
        It binds one biometric identification to one transaction. It is
        presented once, on `POST /instrument-lookup`, where the API Hub proxies
        it to the LFI unverified and the LFI validates it by calling ICP's
        token validation endpoint. The LFI embeds it unchanged in the payment
        token (`AEPaymentToken`). It is not presented again: the payment token
        replaces it at the point of payment.


        Open items: the ICP SDK changes needed for ICP to accept the
        transaction hash and certificate thumbprint and to return this JWS;
        and how `cnf` is checked, since the API Hub terminates mTLS and no
        longer verifies the token.
      example: eyJhbGciOiJQUzI1NiIsImtpZCI6ImljcC1zaWduLTEifQ.eyJpc3MiOiJodHRwczovL2ljcC5nb3YuYWUiLCJzdWIiOiJJQ1AtN2M5ZTFmNGEuLi4ifQ.c2lnbmF0dXJl

    AEIcpTokenClaims:
      type: object
      description: >-
        The claims of `AEIcpToken`, for reference. Signed with `PS256`. The
        BPIP does not build these: it supplies the transaction hash and its
        transport certificate thumbprint to ICP, and ICP signs.
      required: [iss, sub, azp, aud, txn, cnf, amr, jti, iat, exp]
      properties:
        iss:
          type: string
          description: ICP's issuer identifier.
        sub:
          $ref: '#/components/schemas/AEUaeKycId'
        azp:
          type: string
          description: >-
            The BPIP the token was issued to — its Directory organisation
            identifier. The LFI checks it against the `o3-caller-org-id` the
            API Hub sends with the proxied lookup.
        aud:
          type: string
          description: The customer's default LFI, as ICP returned it.
        txn:
          type: string
          description: >-
            Base64url SHA-256 of the canonical JSON of the amount: the
            `TransactionAmount` the BPIP then sends on
            `POST /instrument-lookup`. Any change to the amount after the
            biometric gesture breaks the binding and needs a new gesture. The
            merchant is not bound: `azp` binds the BPIP, which also supplies
            the creditor account at payment.
        cnf:
          type: object
          description: >-
            Binds the token to the BPIP's transport certificate, so that it
            cannot be presented by anyone without the BPIP's mTLS private key.
          required: ['x5t#S256']
          properties:
            x5t#S256:
              type: string
              description: Base64url SHA-256 thumbprint of the BPIP's transport certificate.
        amr:
          type: array
          items:
            type: string
            enum: [Fingerprint, FacialImage, Palm]
        acr:
          type: string
          description: Identity assurance level asserted by ICP. Vocabulary to be confirmed.
        jti:
          type: string
          maxLength: 40
          description: >-
            ICP's identifier for the identification event (`IcpTransactionId`).
            Single-use: ICP marks it used when the LFI validates the token on
            one lookup.
        iat:
          type: number
        exp:
          type: number
          description: Short-lived — proposed 120 seconds after `iat`.

    AEJWEPaymentToken:
      type: string
      title: Encrypted payment token
      description: >-
        A JSON Web Encryption (JWE) object, which encapsulates a JWS. The value
        is a compact serialization of a JWE, which is a string consisting of
        five base64url-encoded parts joined by dots. It encapsulates encrypted
        content using JSON data structures.


        The LFI encrypts it (`RSA-OAEP-256`, `A256GCM`) to the BPIP's public
        encryption key registered in the Directory, identified by `kid` in the
        JWE header, so the API Hub proxies it unread. The decrypted JWS is
        signed by the LFI (`PS256`) and has the structure of the
        `AEPaymentToken` schema. The BPIP verifies the JWS against the LFI's
        signing keys from the Directory, and passes the JWS — not the JWE —
        back to the LFI at the point of payment.
      example: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoiYnBpcC1lbmMtMSIsImN0eSI6IkpXVCJ9....

    AEPaymentToken:
      title: Payment token (decoded)
      description: >-
        The claims of the JWS the LFI signs in answer to
        `POST /instrument-lookup`. Short-lived and single-use. It carries the
        amount from the lookup request, the ICP token unchanged, and the
        details of the payment instrument the customer registered, selected by
        `InstrumentType`. The BPIP passes the JWS back to the LFI once, at the
        point of payment: in `Data.PaymentToken` on `POST /biometric-payments`
        for an `ACCOUNT`, or in the card authorisation through the card scheme
        for a `CARD`. The LFI verifies its own signature and relies on the
        token to make the payment.
      oneOf:
        - $ref: '#/components/schemas/AEPaymentTokenAccount'
        - $ref: '#/components/schemas/AEPaymentTokenCard'
      discriminator:
        propertyName: InstrumentType
        mapping:
          ACCOUNT: '#/components/schemas/AEPaymentTokenAccount'
          CARD: '#/components/schemas/AEPaymentTokenCard'

    AEPaymentTokenCommon:
      type: object
      description: The claims every payment token carries, whatever the instrument type.
      required: [iss, azp, iat, exp, jti, uaeKycId, IcpToken, InstructedAmount, InstrumentType]
      properties:
        iss:
          type: string
          description: The LFI's Directory organisation identifier.
        azp:
          type: string
          description: >-
            The BPIP the token was issued to — its Directory organisation
            identifier, from the `o3-caller-org-id` of the lookup. The LFI
            checks it against the BPIP presenting the token.
        iat:
          type: number
        exp:
          type: number
          description: Short-lived — proposed 120 seconds after `iat`.
        jti:
          type: string
          maxLength: 40
          description: Single-use. The LFI marks it used when it accepts the payment.
        uaeKycId:
          $ref: '#/components/schemas/AEUaeKycId'
        IcpToken:
          description: The ICP token presented on the lookup, embedded unchanged.
          allOf:
            - $ref: '#/components/schemas/AEIcpToken'
        InstructedAmount:
          description: >-
            The `TransactionAmount` from the lookup request. On an `ACCOUNT`
            payment, the amount the LFI debits: `POST /biometric-payments`
            does not repeat it.
          allOf:
            - $ref: '#/components/schemas/AEAmount'
        InstrumentType:
          type: string
          description: >-
            The type of payment instrument the customer registered for BioPay.
            Determines which details the token carries and how the BPIP makes
            the payment: `ACCOUNT` with `POST /biometric-payments`, `CARD`
            through the card scheme (e.g. Jaywan).
          enum: [ACCOUNT, CARD]

    AEPaymentTokenAccount:
      title: ACCOUNT
      description: >-
        Payment token for an account-to-account payment. The BPIP makes the
        payment with `POST /biometric-payments`.
      allOf:
        - $ref: '#/components/schemas/AEPaymentTokenCommon'
        - type: object
          required: [DebtorAccount]
          properties:
            DebtorAccount:
              description: >-
                The customer's account registered for BioPay, which the LFI
                debits on `POST /biometric-payments`. The request does not
                repeat it.
              allOf:
                - $ref: '#/components/schemas/AEDebtorAccount'

    AEPaymentTokenCard:
      title: CARD
      description: >-
        Payment token for a card payment. The BPIP submits the authorisation
        to the card scheme (e.g. Jaywan) as acquirer, with the card details
        and the payment token.
      allOf:
        - $ref: '#/components/schemas/AEPaymentTokenCommon'
        - type: object
          required: [CardDetails]
          properties:
            CardDetails:
              type: object
              description: >-
                The card the customer registered for BioPay. Whether
                `CardNumber` is the card number (PAN) or a card scheme token
                is an open item.
              additionalProperties: false
              required: [CardNumber, ExpiryDate]
              properties:
                CardNumber:
                  type: string
                  pattern: '^\d{12,19}$'
                  example: '4895370012003478'
                ExpiryDate:
                  type: string
                  description: '`MM/YY`. Format to be confirmed.'
                  pattern: '^(0[1-9]|1[0-2])\/\d{2}$'
                  example: 08/29

    AEEventSubscription:
      type: object
      description: >-
        Where the API Hub delivers payment status events for this payment.
        Mirrors the Open Finance `subscription.Webhook` object a TPP sends when
        creating a payment consent, because a biometric payment has no consent
        to carry it. When omitted, or when `IsActive` is `false`, no events are
        delivered and the BPIP polls instead.
      required: [Webhook]
      additionalProperties: false
      properties:
        Webhook:
          type: object
          required: [Url, IsActive]
          additionalProperties: false
          properties:
            Url:
              type: string
              format: uri
              maxLength: 500
              description: >-
                The BPIP's webhook endpoint for this payment's status events.
                MUST be `https`.
              example: https://bpip.example.com/webhooks/biopay
            IsActive:
              type: boolean
              description: Whether the API Hub sends payment status events to `Url`.
              example: true

    AEAmount:
      type: object
      additionalProperties: false
      required: [Amount, Currency]
      properties:
        Amount:
          type: string
          pattern: '^\d{1,13}\.\d{1,5}$'
          example: '149.50'
        Currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: AED

    AEDebtorAccount:
      type: object
      description: The customer's account registered for BioPay.
      additionalProperties: false
      required: [SchemeName, Identification]
      properties:
        SchemeName:
          type: string
          enum: [IBAN]
        Identification:
          type: string
          maxLength: 70
          example: AE070331234567890123456

    AECreditorAccount:
      type: object
      description: >-
        The account credited over AANI, identified by IBAN only. Supplied by
        the BPIP at payment; not carried in the payment token.
      additionalProperties: false
      required: [SchemeName, Identification]
      properties:
        SchemeName:
          type: string
          enum: [IBAN]
        Identification:
          type: string
          maxLength: 70
          example: AE220331234567890876543

    AEPaymentPurposeCode:
      description: >-
        A category code that relates to the type of services or goods that
        corresponds to the underlying purpose of the payment. The code must
        conform to the published Aani payment purpose code list.
      type: string
      minLength: 1
      maxLength: 3
      pattern: ^[A-Z]{3}$
      example: ACM

    AEDebtorReference:
      description: >-
        A Debtor Reference is a note is for the reference of a given User that
        may be available as additional information in relation to a given
        payment instruction.
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^[A-Za-z0-9 \/?:().,'+-]+$
      example: Example Grocers 000731

    AECreditorReference:
      description: >-
        A Creditor Reference is a note for a given Creditor or Creditor LFI that
        supports reconciliation of a given payment instruction.
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^[A-Za-z0-9 \/?:().,'+-]+$
      example: POS T-0042 RRN 628810000731

    AEBiometricPaymentRequest:
      type: object
      additionalProperties: false
      required: [Data, Risk]
      properties:
        Data:
          type: object
          additionalProperties: false
          required: [PaymentToken, CreditorAccount, PaymentPurposeCode]
          properties:
            PaymentToken:
              description: >-
                The payment token: the compact JWS signed by the LFI, taken
                unchanged from inside the lookup response's JWE
                (`AEJWEPaymentToken`) — not the JWE itself. Its claims are
                `AEPaymentToken` with `InstrumentType: ACCOUNT`, and carry the
                `uaeKycId`, `DebtorAccount` and `InstructedAmount` of the
                payment.
              type: string
              example: eyJhbGciOiJQUzI1NiIsImtpZCI6ImxmaS1zaWduLTEifQ.eyJpc3MiOiJbTEZJX09SR0FOSVNBVElPTl9JRF0ifQ.c2lnbmF0dXJl
            CreditorAccount:
              $ref: '#/components/schemas/AECreditorAccount'
            PaymentPurposeCode:
              $ref: '#/components/schemas/AEPaymentPurposeCode'
            DebtorReference:
              $ref: '#/components/schemas/AEDebtorReference'
            CreditorReference:
              $ref: '#/components/schemas/AECreditorReference'
            Subscription:
              $ref: '#/components/schemas/AEEventSubscription'
        Risk:
          type: object
          title: Risk (to be defined)
          description: >-
            **Not yet specified.** A placeholder for risk information the BPIP
            may pass to the LFI for its fraud checks. Its contents are an open
            item; until they are defined, send an empty object.
          example: {}

    AEPaymentId:
      type: string
      maxLength: 40
      description: The API Hub's identifier for the payment.

    AECreationDateTime:
      type: string
      format: date-time
      description: When the API Hub created the payment.

    AEStatusUpdateDateTime:
      type: string
      format: date-time
      description: When `Status` last changed.

    AEBiometricPaymentToken:
      type: string
      description: >-
        The payment token the BPIP sent: the compact JWS signed by the LFI,
        unchanged. Its claims are `AEPaymentToken` with
        `InstrumentType: ACCOUNT`, and carry the `uaeKycId`, `DebtorAccount`
        and `InstructedAmount` of the payment.
      example: eyJhbGciOiJQUzI1NiIsImtpZCI6ImxmaS1zaWduLTEifQ.eyJpc3MiOiJbTEZJX09SR0FOSVNBVElPTl9JRF0ifQ.c2lnbmF0dXJl

    AEPaymentTransactionId:
      type: string
      description: >-
        This is an end to end TransactionId that identifies the payment on the
        underlying payment rail as it is sent from an Originating LFI to a
        Receiving LFI.


        For payments settled over AANI, this is the Transaction Identification
        (`TxId`) the Originating LFI assigned in the pacs.008 credit transfer.
        It is not issued by AANI, and starts with `OFP`.


        This is not the same as the TransactionID in the Account Information
        Transactions API.


        The PaymentTransactionId must be populated if the payment is processed
        by the LFI.
      minLength: 1
      maxLength: 40
      example: OFP7d2c1e9a4b6f4c0e8a1b

    AEMessage:
      type: string
      minLength: 1
      maxLength: 500
      description: >-
        A description of the error that occurred. e.g., 'A mandatory field
        isn't supplied' or 'RequestedExecutionDateTime must be in future'


        This field is not standardised

    AERejectReason:
      description: Rejection Reason
      type: object
      required: [Code, Message]
      additionalProperties: false
      properties:
        Code:
          description: >-
            Rejected Reason Code is a namespaced rejection reason code. The
            first part of the code is the namespace, which is the name of the
            organisation or system (e.g., AANI) that is rejecting the payment,
            and the second part is the specific rejection reason code for the
            originating organisation or system.


            Payments that are rejected by AANI will have the AANI prefix,
            followed by the specific ANNI reason code.


            The Payment resouce is updated with the rejection reason code if a
            Rejected payment is initially created in a Pending state.


            If the Payment resource is rejected, and no Payment resource is
            created - a 4xx HTTP status code is returned to the TPP with the
            appropriate Error Response.
          type: string
          pattern: ^[A-Za-z]+\.[A-Za-z0-9]+$
          example: AANI.AM04
        Message:
          $ref: '#/components/schemas/AEMessage'

    AEBiometricPayment:
      description: >-
        The payment resource. It mirrors `Data` of the
        `POST /biometric-payments` request, with the `PaymentId` and the
        status the API Hub holds. A payment is `Pending` until the LFI patches
        it with `PATCH /biometrics-payment-log/{id}`; from then on
        `PaymentRail` and `Status` select its shape, as they select the patch
        body.
      oneOf:
        - $ref: '#/components/schemas/AEBiometricPaymentPending'
        - $ref: '#/components/schemas/AEBiometricPaymentAani'
        - $ref: '#/components/schemas/AEBiometricPaymentLfi'

    AEBiometricPaymentAani:
      title: AANI
      description: >-
        A payment the LFI has routed to AANI. `PaymentTransactionId` is always
        present.
      oneOf:
        - $ref: '#/components/schemas/AEBiometricPaymentAaniAccepted'
        - $ref: '#/components/schemas/AEBiometricPaymentAaniRejected'

    AEBiometricPaymentLfi:
      title: LFI
      description: >-
        A payment the LFI booked on its own ledger. Both statuses are terminal,
        and there is no `PaymentTransactionId`.
      oneOf:
        - $ref: '#/components/schemas/AEBiometricPaymentLfiAccepted'
        - $ref: '#/components/schemas/AEBiometricPaymentLfiRejected'

    AEBiometricPaymentPending:
      title: Pending
      description: As created by `POST /biometric-payments`, before the LFI has patched it.
      type: object
      additionalProperties: false
      required: [PaymentId, Status, CreationDateTime, StatusUpdateDateTime, PaymentToken, CreditorAccount, PaymentPurposeCode]
      properties:
        PaymentId:
          $ref: '#/components/schemas/AEPaymentId'
        Status:
          description: The LFI has not yet reported the outcome.
          type: string
          enum: [Pending]
        CreationDateTime:
          $ref: '#/components/schemas/AECreationDateTime'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/AEStatusUpdateDateTime'
        PaymentToken:
          $ref: '#/components/schemas/AEBiometricPaymentToken'
        CreditorAccount:
          $ref: '#/components/schemas/AECreditorAccount'
        PaymentPurposeCode:
          $ref: '#/components/schemas/AEPaymentPurposeCode'
        DebtorReference:
          $ref: '#/components/schemas/AEDebtorReference'
        CreditorReference:
          $ref: '#/components/schemas/AECreditorReference'
        Subscription:
          $ref: '#/components/schemas/AEEventSubscription'

    AEBiometricPaymentAaniAccepted:
      title: AANI — accepted
      description: A payment AANI has accepted or is processing.
      type: object
      additionalProperties: false
      required: [PaymentId, Status, CreationDateTime, StatusUpdateDateTime, PaymentToken, CreditorAccount, PaymentPurposeCode, PaymentRail, PaymentTransactionId]
      properties:
        PaymentId:
          $ref: '#/components/schemas/AEPaymentId'
        Status:
          description: >-
            * `AcceptedSettlementCompleted`: **not terminal.** The LFI has
            passed the payment to AANI and is awaiting confirmation.


            * `AcceptedWithoutPosting`: terminal. AANI has confirmed the
            payment.
          type: string
          enum: [AcceptedSettlementCompleted, AcceptedWithoutPosting]
        CreationDateTime:
          $ref: '#/components/schemas/AECreationDateTime'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/AEStatusUpdateDateTime'
        PaymentToken:
          $ref: '#/components/schemas/AEBiometricPaymentToken'
        CreditorAccount:
          $ref: '#/components/schemas/AECreditorAccount'
        PaymentPurposeCode:
          $ref: '#/components/schemas/AEPaymentPurposeCode'
        DebtorReference:
          $ref: '#/components/schemas/AEDebtorReference'
        CreditorReference:
          $ref: '#/components/schemas/AECreditorReference'
        PaymentRail:
          description: Settled over AANI, the UAE instant payment platform.
          type: string
          enum: [AANI]
          example: AANI
        PaymentTransactionId:
          $ref: '#/components/schemas/AEPaymentTransactionId'
        Subscription:
          $ref: '#/components/schemas/AEEventSubscription'

    AEBiometricPaymentAaniRejected:
      title: AANI — rejected
      description: A payment routed to AANI that will not be settled. Terminal.
      type: object
      additionalProperties: false
      required: [PaymentId, Status, CreationDateTime, StatusUpdateDateTime, PaymentToken, CreditorAccount, PaymentPurposeCode, PaymentRail, PaymentTransactionId, RejectReasonCode]
      properties:
        PaymentId:
          $ref: '#/components/schemas/AEPaymentId'
        Status:
          type: string
          enum: [Rejected]
        CreationDateTime:
          $ref: '#/components/schemas/AECreationDateTime'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/AEStatusUpdateDateTime'
        PaymentToken:
          $ref: '#/components/schemas/AEBiometricPaymentToken'
        CreditorAccount:
          $ref: '#/components/schemas/AECreditorAccount'
        PaymentPurposeCode:
          $ref: '#/components/schemas/AEPaymentPurposeCode'
        DebtorReference:
          $ref: '#/components/schemas/AEDebtorReference'
        CreditorReference:
          $ref: '#/components/schemas/AECreditorReference'
        PaymentRail:
          description: Settled over AANI, the UAE instant payment platform.
          type: string
          enum: [AANI]
          example: AANI
        PaymentTransactionId:
          $ref: '#/components/schemas/AEPaymentTransactionId'
        RejectReasonCode:
          description: Why the payment was rejected. Codes are `AANI.*` only.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AERejectReason'
        Subscription:
          $ref: '#/components/schemas/AEEventSubscription'

    AEBiometricPaymentLfiAccepted:
      title: LFI — accepted
      description: The LFI has booked the payment on its own ledger and the funds are available to the creditor. Terminal.
      type: object
      additionalProperties: false
      required: [PaymentId, Status, CreationDateTime, StatusUpdateDateTime, PaymentToken, CreditorAccount, PaymentPurposeCode, PaymentRail]
      properties:
        PaymentId:
          $ref: '#/components/schemas/AEPaymentId'
        Status:
          type: string
          enum: [AcceptedCreditSettlementCompleted]
        CreationDateTime:
          $ref: '#/components/schemas/AECreationDateTime'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/AEStatusUpdateDateTime'
        PaymentToken:
          $ref: '#/components/schemas/AEBiometricPaymentToken'
        CreditorAccount:
          $ref: '#/components/schemas/AECreditorAccount'
        PaymentPurposeCode:
          $ref: '#/components/schemas/AEPaymentPurposeCode'
        DebtorReference:
          $ref: '#/components/schemas/AEDebtorReference'
        CreditorReference:
          $ref: '#/components/schemas/AECreditorReference'
        PaymentRail:
          description: Booked on the LFI's own ledger, because it also holds the creditor account.
          type: string
          enum: [LFI]
          example: LFI
        Subscription:
          $ref: '#/components/schemas/AEEventSubscription'

    AEBiometricPaymentLfiRejected:
      title: LFI — rejected
      description: A payment the LFI will not settle. Terminal.
      type: object
      additionalProperties: false
      required: [PaymentId, Status, CreationDateTime, StatusUpdateDateTime, PaymentToken, CreditorAccount, PaymentPurposeCode, PaymentRail, RejectReasonCode]
      properties:
        PaymentId:
          $ref: '#/components/schemas/AEPaymentId'
        Status:
          type: string
          enum: [Rejected]
        CreationDateTime:
          $ref: '#/components/schemas/AECreationDateTime'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/AEStatusUpdateDateTime'
        PaymentToken:
          $ref: '#/components/schemas/AEBiometricPaymentToken'
        CreditorAccount:
          $ref: '#/components/schemas/AECreditorAccount'
        PaymentPurposeCode:
          $ref: '#/components/schemas/AEPaymentPurposeCode'
        DebtorReference:
          $ref: '#/components/schemas/AEDebtorReference'
        CreditorReference:
          $ref: '#/components/schemas/AECreditorReference'
        PaymentRail:
          description: Booked on the LFI's own ledger, because it also holds the creditor account.
          type: string
          enum: [LFI]
          example: LFI
        RejectReasonCode:
          description: Why the payment was rejected. Codes are `LFI.*` only.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AERejectReason'
        Subscription:
          $ref: '#/components/schemas/AEEventSubscription'

    AEBiometricPaymentLogPatch:
      description: >-
        The fields to be patched. Aligned with `CbuaePatchPaymentRecordBody` on
        the v2.2 Consent Manager operation `PATCH /payment-log/{id}`, limited
        to the `AANI` and `LFI` rails: a biometric payment is never settled
        over UAEFTS.


        `paymentResponse.paymentRail` selects the rail, and
        `paymentResponse.status` the body within it. Reject reason codes are
        namespaced to the rail — `AANI.*` or `LFI.*` — including for a payment
        the LFI rejected before submitting it to AANI.
      oneOf:
        - $ref: '#/components/schemas/AEBiometricPaymentLogPatchAani'
        - $ref: '#/components/schemas/AEBiometricPaymentLogPatchLfi'

    AEBiometricPaymentLogPatchAani:
      title: AANI
      description: >-
        A patch to a payment the LFI has routed to AANI, the UAE instant
        payment platform. `paymentResponse.paymentTransactionId` is required on
        every patch.
      oneOf:
        - $ref: '#/components/schemas/AEBiometricPaymentLogPatchAaniAccepted'
        - $ref: '#/components/schemas/AEBiometricPaymentLogPatchAaniRejected'

    AEBiometricPaymentLogPatchAaniAccepted:
      title: AANI — accepted
      description: A payment AANI has accepted or is processing.
      type: object
      required:
        - paymentResponse.paymentRail
        - paymentResponse.status
        - paymentResponse.paymentTransactionId
      additionalProperties: false
      properties:
        paymentResponse.paymentRail:
          description: Identifies AANI as the rail the payment was routed to.
          type: string
          enum: [AANI]
          example: AANI
        paymentResponse.status:
          description: >-
            * `AcceptedSettlementCompleted`: **not terminal.** The LFI has
            passed the payment to AANI and is awaiting confirmation. Once AANI
            confirms the payment the LFI MUST patch the record again, to
            `AcceptedWithoutPosting`.


            * `AcceptedWithoutPosting`: terminal. AANI has confirmed the
            payment.
          type: string
          enum: [AcceptedSettlementCompleted, AcceptedWithoutPosting]
        paymentResponse.paymentTransactionId:
          $ref: '#/components/schemas/AEPaymentLogPaymentTransactionIdAani'

    AEBiometricPaymentLogPatchAaniRejected:
      title: AANI — rejected
      description: A payment routed to AANI that will not be settled. Terminal.
      type: object
      required:
        - paymentResponse.paymentRail
        - paymentResponse.status
        - paymentResponse.paymentTransactionId
        - paymentResponse.rejectReasonCode
      additionalProperties: false
      properties:
        paymentResponse.paymentRail:
          description: Identifies AANI as the rail the payment was routed to.
          type: string
          enum: [AANI]
          example: AANI
        paymentResponse.status:
          type: string
          enum: [Rejected]
        paymentResponse.paymentTransactionId:
          $ref: '#/components/schemas/AEPaymentLogPaymentTransactionIdAani'
        paymentResponse.rejectReasonCode:
          $ref: '#/components/schemas/AEPaymentLogRejectReasonCodeAani'

    AEBiometricPaymentLogPatchLfi:
      title: LFI
      description: >-
        A patch to a payment the LFI booked on its own ledger, because it also
        holds the creditor account. Both statuses are terminal, and there is no
        `paymentResponse.paymentTransactionId`.
      oneOf:
        - $ref: '#/components/schemas/AEBiometricPaymentLogPatchLfiAccepted'
        - $ref: '#/components/schemas/AEBiometricPaymentLogPatchLfiRejected'

    AEBiometricPaymentLogPatchLfiAccepted:
      title: LFI — accepted
      description: >-
        The LFI has booked the payment on its own ledger and the funds are
        available to the creditor. Terminal.
      type: object
      required:
        - paymentResponse.paymentRail
        - paymentResponse.status
      additionalProperties: false
      properties:
        paymentResponse.paymentRail:
          description: Identifies the LFI's own ledger as where the payment was settled.
          type: string
          enum: [LFI]
          example: LFI
        paymentResponse.status:
          type: string
          enum: [AcceptedCreditSettlementCompleted]

    AEBiometricPaymentLogPatchLfiRejected:
      title: LFI — rejected
      description: A payment the LFI will not settle. Terminal.
      type: object
      required:
        - paymentResponse.paymentRail
        - paymentResponse.status
        - paymentResponse.rejectReasonCode
      additionalProperties: false
      properties:
        paymentResponse.paymentRail:
          description: Identifies the LFI's own ledger as where the payment was settled.
          type: string
          enum: [LFI]
          example: LFI
        paymentResponse.status:
          type: string
          enum: [Rejected]
        paymentResponse.rejectReasonCode:
          $ref: '#/components/schemas/AEPaymentLogRejectReasonCodeLfi'

    AEPaymentLogPaymentTransactionIdAani:
      description: >-
        The Transaction Identification (`TxId`) the LFI assigned to the payment
        in the AANI pacs.008 credit transfer. It is assigned by the Originating
        LFI, not issued by AANI, and passes unchanged through AANI to the
        Receiving LFI. This is not the same value as the `transactionId` in the
        Bank Data Sharing API. The value MUST start with `OFP`. Returned to the
        BPIP as `PaymentTransactionId`.
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^OFP
      example: OFP7d2c1e9a4b6f4c0e8a1b

    AEPaymentLogRejectReasonCodeAani:
      description: >-
        A list of reject reason codes provided by the LFI for a payment routed
        to AANI. Returned to the BPIP as `RejectReasonCode`.


        Where this list is patched repeatedly the LFI **MUST** append to the
        existing list **BEFORE** calling the patch operation, to ensure all
        values are maintained, unless the reject reason was patched in error
        and the existing value is being replaced.
      type: array
      minItems: 1
      items:
        description: >-
          The reason for rejection of a given payment request as detected by
          the LFI. The `code` and `message` properties are transposed EXACTLY
          in event notifications sent to the BPIP, so the `message` value MUST
          be sanitized accordingly.
        type: object
        required: [code, message]
        additionalProperties: false
        properties:
          code:
            description: >-
              AANI reason code, namespaced to the rail. AANI reason codes are
              the standard set for this rail and carry every rejection reported
              against it, including a rejection raised at the LFI before the
              payment was submitted to AANI.
            type: string
            pattern: ^AANI\.[A-Za-z0-9]+$
            example: AANI.AM04
          message:
            description: Error message describing the rejection reason
            type: string
            minLength: 1
            maxLength: 500
            example: Payment request cannot be executed as insufficient funds at debtor account.

    AEPaymentLogRejectReasonCodeLfi:
      description: >-
        A list of reject reason codes provided by the LFI for a payment settled
        on the LFI's own ledger. Returned to the BPIP as `RejectReasonCode`.


        Where this list is patched repeatedly the LFI **MUST** append to the
        existing list **BEFORE** calling the patch operation, to ensure all
        values are maintained, unless the reject reason was patched in error
        and the existing value is being replaced.
      type: array
      minItems: 1
      items:
        description: >-
          The reason for rejection of a given payment request as detected by
          the LFI. The `code` and `message` properties are transposed EXACTLY
          in event notifications sent to the BPIP, so the `message` value MUST
          be sanitized accordingly.
        type: object
        required: [code, message]
        additionalProperties: false
        properties:
          code:
            description: >-
              LFI reason code, namespaced to the rail. The payment never left
              the LFI, so every rejection reported against it is the LFI's own.
            type: string
            pattern: ^LFI\.[A-Za-z0-9]+$
            example: LFI.AM04
          message:
            description: Error message describing the rejection reason
            type: string
            minLength: 1
            maxLength: 500
            example: Payment request cannot be executed as insufficient funds at debtor account.

    AEBiometricPaymentCreatedResponse:
      type: object
      description: >-
        The response to `POST /biometric-payments`. The payment is always
        `Pending`.
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          $ref: '#/components/schemas/AEBiometricPaymentPending'
        Links:
          $ref: '#/components/schemas/AELinks'
        Meta:
          $ref: '#/components/schemas/AEMeta'

    AEBiometricPaymentResponse:
      type: object
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          $ref: '#/components/schemas/AEBiometricPayment'
        Links:
          $ref: '#/components/schemas/AELinks'
        Meta:
          $ref: '#/components/schemas/AEMeta'

    AEBiometricPaymentStatusEventSigned:
      type: object
      description: >-
        Signed event envelope, copied from `AEWebhookEventSigned` in the
        published webhook template so that a BioPay event is verified exactly
        like every other Open Finance webhook. `iss` is the API Hub; `aud`
        holds the BPIP's client identifier.
      additionalProperties: false
      required: [iss, exp, nbf, message]
      properties:
        iss:
          type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1)'
        exp:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4)'
        nbf:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5)'
        aud:
          type: array
          items:
            type: string
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3)'
        iat:
          type: number
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6)'
        jti:
          type: string
          description: Unique per delivery. The BPIP SHOULD reject a `jti` it has already processed.
        message:
          $ref: '#/components/schemas/AEBiometricPaymentStatusEvent'

    AEBiometricPaymentStatusEvent:
      type: object
      description: >-
        The `message` of the signed payment status event. `Data` replicates the
        payment resource as it stands after the change; `Meta` describes the
        event itself.
      additionalProperties: false
      required: [Data, Meta]
      properties:
        Data:
          description: >-
            The payment as it stands after the LFI's patch. Never `Pending`:
            the event is only sent when the LFI patches the payment.
          oneOf:
            - $ref: '#/components/schemas/AEBiometricPaymentAani'
            - $ref: '#/components/schemas/AEBiometricPaymentLfi'
        Meta:
          type: object
          additionalProperties: false
          required: [EventDateTime, EventResource, EventType, PaymentId]
          properties:
            EventDateTime:
              type: string
              format: date-time
            EventResource:
              type: string
              example: /biometric-payments/7130812d-4d81-4c68-8187-6358cfbce521
            EventType:
              type: string
              enum:
                - Resource.Updated
            PaymentId:
              type: string
              maxLength: 40
              description: >-
                The payment the event concerns. Occupies the position
                `ConsentId` holds in the published payment status event.

    AEInstrumentLookupRequest:
      type: object
      description: >-
        Instrument lookup request. Carries the identifier and the ICP token ICP
        returned on resolution, and the amount that token is bound to.
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          type: object
          additionalProperties: false
          required: [uaeKycId, IcpToken, TransactionAmount]
          properties:
            uaeKycId:
              description: >-
                Know Your Customer identification reference, as ICP returned
                it. MUST equal the ICP token's `sub`.
              allOf:
                - $ref: '#/components/schemas/AEUaeKycId'
            IcpToken:
              description: >-
                The ICP token for this transaction, unchanged. Its `txn` MUST
                equal the hash of `TransactionAmount`.
              allOf:
                - $ref: '#/components/schemas/AEIcpToken'
            TransactionAmount:
              description: >-
                The amount processed for the transaction (DE04). Returned as
                `InstructedAmount` in the payment token.
              allOf:
                - $ref: '#/components/schemas/AEAmount'

    AEInstrumentLookupResponse:
      type: object
      description: >-
        Instrument lookup response. `Data` is the payment token: there is no
        other content.
      additionalProperties: false
      required: [Data]
      properties:
        Data:
          description: >-
            The payment token, represented in both encoded and decoded form
            using an `anyOf`, to help implementers readily understand both the
            structure and serialized form of the property.


            **Implementations MUST reflect the AEJWEPaymentToken Schema Object
            structure and the notes provided on implementing a JWS and JWE.**


            **The decoded form AEPaymentToken is for guidance on content only.**
          anyOf:
            - $ref: '#/components/schemas/AEPaymentToken'
            - $ref: '#/components/schemas/AEJWEPaymentToken'

    AELinks:
      type: object
      additionalProperties: false
      required: [Self]
      properties:
        Self:
          type: string
          format: uri

    AEMeta:
      type: object
      additionalProperties: false
      properties:
        TotalPages:
          type: integer

    AEErrorResponse:
      type: object
      additionalProperties: false
      required: [Code, Errors]
      properties:
        Code:
          type: string
        Id:
          type: string
          description: Correlates to `x-fapi-interaction-id`.
        Message:
          type: string
        Errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [ErrorCode]
            properties:
              ErrorCode:
                type: string
              Message:
                type: string
              Path:
                type: string
